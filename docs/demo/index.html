<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Qazaq Trainer — мок-тесты ҚАЗТЕСТ и QazResmiTest по уровням A1–C2 с аудированием, письмом и говорением"><style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Qazaq Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg:#faf8f3; --surface:#ffffff; --surface-raised:#f5f2ea;
  --ink:#1e2a30; --ink-muted:#5c6b70; --ink-faint:#8a9599;
  --accent:#0e6e86; --accent-ink:#ffffff; --accent-soft:#e4f1f2;
  --gold:#b8842e; --gold-soft:#f6ecd8;
  --good:#3f7d4a; --good-soft:#e7f1e4;
  --bad:#b0463a; --bad-soft:#f8e6e3;
  --border:#e6e0d2; --border-strong:#d5cdb8;
  --shadow:0 1px 2px rgba(30,42,48,.06),0 8px 24px -12px rgba(30,42,48,.12);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171b; --surface:#182226; --surface-raised:#1d2a2f;
    --ink:#e9e4d8; --ink-muted:#9fadb2; --ink-faint:#6d7a7e;
    --accent:#5cc2dc; --accent-ink:#0a1417; --accent-soft:#1c343a;
    --gold:#e0b563; --gold-soft:#2b2416;
    --good:#7fbf8a; --good-soft:#1c2e1f;
    --bad:#e08a7e; --bad-soft:#3a1f1b;
    --border:#2a3438; --border-strong:#3a4448;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#10171b; --surface:#182226; --surface-raised:#1d2a2f;
  --ink:#e9e4d8; --ink-muted:#9fadb2; --ink-faint:#6d7a7e;
  --accent:#5cc2dc; --accent-ink:#0a1417; --accent-soft:#1c343a;
  --gold:#e0b563; --gold-soft:#2b2416;
  --good:#7fbf8a; --good-soft:#1c2e1f;
  --bad:#e08a7e; --bad-soft:#3a1f1b;
  --border:#2a3438; --border-strong:#3a4448;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:var(--fs,16px);line-height:1.6}
html[data-size=s]{--fs:14.5px}html[data-size=m]{--fs:16px}html[data-size=l]{--fs:18px}html[data-size=xl]{--fs:20.5px}
html[data-font=dys]{--sans:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;--serif:'Atkinson Hyperlegible',Verdana,sans-serif}
html[data-font=dys] body{letter-spacing:.02em;word-spacing:.06em;line-height:1.75}
html:not(.hints) .hintx{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;z-index:50}
.skip:focus{left:8px}
.uipanel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:-12px 0 22px;display:flex;flex-direction:column;gap:10px}
.uipanel .row{gap:12px}.uipanel .lbl{min-width:150px;font-size:13.5px;color:var(--ink-muted)}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
[tabindex="0"]:focus-visible,.wcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:840px;margin:0 auto;padding:28px 22px 110px}

/* ---- top bar / breadcrumb ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.crumbs a{color:var(--ink-muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.crumbs span.sep{color:var(--border-strong)}
.crumbs b{color:var(--ink);font-weight:600}

.kicker{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.kicker::before{content:"";width:20px;height:1px;background:var(--accent)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.6vw,38px);line-height:1.14;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 6px;letter-spacing:-.005em}
h3{font-family:var(--serif);font-weight:600;font-size:16.5px;margin:0 0 10px}
.lede{color:var(--ink-muted);font-size:16.5px;max-width:64ch;margin:0 0 26px}
.lede b{color:var(--ink);font-weight:600}
.sub{color:var(--ink-muted);font-size:15px;margin:0 0 18px;max-width:64ch}
section{margin-bottom:44px}

/* ---- badges ---- */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:6px;white-space:nowrap}
.badge.level{color:var(--accent);background:var(--accent-soft)}
.badge.exam{color:var(--ink-muted);background:var(--surface-raised);border:1px solid var(--border)}
.badge.ok{color:var(--good);background:var(--good-soft)}
.badge.warn{color:var(--gold);background:var(--gold-soft)}
.badge.muted{color:var(--ink-faint);background:var(--surface-raised)}
.badge.bad{color:var(--bad);background:var(--bad-soft)}

/* ---- notices ---- */
.notice{background:var(--gold-soft);border:1px solid var(--border-strong);border-left:3px solid var(--gold);border-radius:8px;padding:14px 16px;font-size:14.5px;margin:0 0 22px}
.notice b.t{color:var(--gold);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px}
.notice p{margin:0 0 6px}.notice p:last-child{margin:0}
.notice ul{margin:6px 0 0 18px;padding:0}
.notice.info{background:var(--accent-soft);border-left-color:var(--accent);border-color:var(--border)}
.notice.info b.t{color:var(--accent)}
.notice.good{background:var(--good-soft);border-left-color:var(--good);border-color:var(--border)}
.notice.good b.t{color:var(--good)}

/* ---- cards / blocks ---- */
.block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.block p{margin:0 0 10px;font-size:15px}
.block p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

.exam-card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow);transition:border-color .15s}
.exam-card:hover{border-color:var(--accent)}
.exam-card .name{font-family:var(--serif);font-size:24px;font-weight:600;margin:6px 0 4px}
.exam-card .tag{color:var(--ink-muted);font-size:14.5px;margin:0 0 14px}
.levels{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.level-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 16px;background:var(--surface);text-decoration:none;color:inherit}
.level-row:hover{background:var(--surface-raised)}
.level-row.draft{opacity:.7;cursor:default}
.level-row .lvl{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent);width:34px}
.level-row .nm{font-weight:600;font-size:15px}
.level-row .dsc{font-size:13px;color:var(--ink-muted)}
.level-row .st{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}

/* ---- stages list (exam structure) ---- */
.stages{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.stage{background:var(--surface);padding:15px 18px;display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:start;text-decoration:none;color:inherit}
a.stage:hover{background:var(--surface-raised)}
.stage.locked{opacity:.55}
.stage-num{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--accent);padding-top:2px}
.stage-name{font-weight:600;font-size:15.5px;margin:0 0 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage-desc{color:var(--ink-muted);font-size:14px;margin:0;max-width:54ch}
.stage-meta{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage-time{font-weight:600;font-size:14.5px}
.stage-tasks{font-size:12px;color:var(--ink-faint);margin-top:2px}
.stage-score{font-size:12.5px;margin-top:4px;font-weight:600}
.stage-score.good{color:var(--good)}.stage-score.mid{color:var(--gold)}.stage-score.bad{color:var(--bad)}
.stages-total{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;background:var(--surface-raised);font-family:var(--mono);font-size:13px;color:var(--ink-muted)}
.stages-total b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- level ladder ---- */
.ladder{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rung{flex:1;padding:14px 12px;border-right:1px solid var(--border);background:var(--surface)}
.rung:last-child{border-right:none}
.rung-level{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent)}
.rung-name{font-size:12.5px;color:var(--ink-muted);margin:2px 0 8px}
.rung-units{font-size:12px;color:var(--ink-faint)}
.rung-focus{font-size:12.5px;color:var(--ink-muted);margin-top:8px;line-height:1.45}

/* ---- timer bar ---- */
.timerbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 0 12px;margin:-6px 0 22px}
.timerbar .lbl{font-family:var(--mono);font-size:12px;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase}
.timerbar .clock{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.timerbar .clock.warn{color:var(--gold)}
.timerbar .clock.over{color:var(--bad)}
.timerbar .right{display:flex;align-items:center;gap:10px}

/* ---- script / passage ---- */
.script{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.8;background:var(--surface-raised);border-left:3px solid var(--accent);padding:14px 18px;border-radius:0 8px 8px 0;margin-bottom:6px}
.script-note{font-size:12.5px;color:var(--ink-faint);margin:6px 0 16px}
.passage{font-size:15.5px;line-height:1.78;margin-bottom:6px}
.passage p{margin:0 0 12px}.passage p:last-child{margin:0}
.passage-title{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px}
.hidden-script{padding:18px;border:1px dashed var(--border-strong);border-radius:8px;text-align:center;color:var(--ink-faint);font-size:14px;margin-bottom:18px}

/* ---- questions ---- */
.q{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--border)}
.q:first-child{border-top:none;padding-top:0;margin-top:0}
.q-text{font-weight:600;font-size:15.5px;margin:0 0 10px}
.q-text .qn{font-family:var(--mono);color:var(--accent);margin-right:8px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:15px;background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt input{margin:5px 0 0;accent-color:var(--accent)}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--ink-muted);min-width:16px}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.correct .k::after{content:" ✓";color:var(--good)}.opt.wrong .k::after{content:" ✗";color:var(--bad)}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--border)}
.opt.correct.locked:hover{border-color:var(--good)}
.opt.wrong.locked:hover{border-color:var(--bad)}
.explain{margin-top:8px;padding:9px 13px;background:var(--surface-raised);border-left:3px solid var(--good);border-radius:0 6px 6px 0;font-size:14px;color:var(--ink)}
.explain.bad{border-left-color:var(--bad)}
.explain b{color:var(--good)}.explain.bad b{color:var(--bad)}
.verdict{font-family:var(--mono);font-size:12px;font-weight:600;margin-left:8px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:600;font-size:14.5px;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;line-height:1.3}
.btn:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--surface);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink-muted);border-color:var(--border)}
.btn.ghost:hover{color:var(--accent);border-color:var(--accent)}
.btn.small{font-size:13px;padding:6px 12px}
.btn.gear{font-size:24px;line-height:1;padding:2px 10px;color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--border)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.actions .hint{font-size:13px;color:var(--ink-faint)}

/* ---- result summary ---- */
.score-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow)}
.score-big{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score-big small{font-size:18px;color:var(--ink-faint)}
.score-card .m{font-size:14px;color:var(--ink-muted)}

/* ---- writing ---- */
.prompt-list{list-style:none;margin:0;padding:0;counter-reset:p}
.prompt-list li{counter-increment:p;display:grid;grid-template-columns:26px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:15.5px}
.prompt-list li:first-child{border-top:none}
.prompt-list li::before{content:counter(p);font-family:var(--mono);font-weight:600;color:var(--accent)}
.prompt-pick{display:flex;flex-direction:column;gap:8px}
.prompt-pick .opt{align-items:center}
.skeleton{display:flex;flex-direction:column;gap:6px;margin:12px 0 16px}
.skel{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:14px}
.skel .tag{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-faint)}
.skel .hint{color:var(--ink-muted);font-size:13px}
.skel.now{border-color:var(--accent);background:var(--accent-soft)}
.skel.now .tag{color:var(--accent)}
.skel.past{opacity:.55}
textarea.essay{width:100%;min-height:260px;font-family:var(--sans);font-size:16px;line-height:1.6;padding:14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
textarea.essay:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.wc{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);margin-top:6px;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
.tag-chip{font-size:13.5px;padding:4px 10px;border-radius:20px;background:var(--surface-raised);border:1px solid var(--border);color:var(--ink)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.checklist li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{margin-top:4px;accent-color:var(--good)}
.checklist li.static::before{content:"";width:15px;height:15px;margin-top:4px;flex-shrink:0;border:1.5px solid var(--border-strong);border-radius:4px}
.essay-view{white-space:pre-wrap;font-size:15.5px;line-height:1.7;background:var(--surface-raised);padding:14px 16px;border-radius:8px;border:1px solid var(--border)}

/* ---- speaking ---- */
.timebar{display:flex;height:24px;border-radius:6px;overflow:hidden;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent-ink)}
.timebar span{display:flex;align-items:center;justify-content:center;background:var(--accent);opacity:.55}
.timebar span.now{opacity:1}
.timebar span + span{border-left:1px solid var(--bg)}
.timebar-labels{display:flex;font-size:12px;color:var(--ink-faint);margin-top:5px}
.timebar-labels span{flex:1;text-align:center}
.sq{padding:14px 0;border-top:1px solid var(--border)}
.sq:first-child{border-top:none;padding-top:0}
.sq .qt{font-size:16px;font-weight:600;margin:0 0 8px}
.sq .qt .qn{font-family:var(--mono);color:var(--accent);margin-right:8px}
.sq .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sq .clock{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:56px}
.sq .phase{font-family:var(--mono);font-size:12px;color:var(--ink-muted)}
.sq.done .qt{color:var(--ink-muted)}

/* ---- misc ---- */
.setlabel{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:6px;margin:0 0 12px}
.setlabel.extra{color:var(--gold);background:var(--gold-soft)}
.progress-dots{display:flex;gap:6px;align-items:center}
.progress-dots i{width:9px;height:9px;border-radius:50%;background:var(--border-strong);display:inline-block}
.progress-dots i.done{background:var(--good)}
.progress-dots i.part{background:var(--gold)}
.progress-dots i.cur{outline:2px solid var(--accent);outline-offset:2px}
.io textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:12px;padding:10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.srclist{margin:8px 0 0 18px;padding:0;font-size:13.5px}
.srclist li{margin-bottom:3px}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink-faint)}
footer a{color:var(--ink-muted)}
.muted{color:var(--ink-muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.mt{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
@media (max-width:560px){
  .stage{grid-template-columns:28px 1fr}
  .stage-meta{grid-column:2;text-align:left;margin-top:6px}
  .ladder{flex-direction:column}
  .rung{border-right:none;border-bottom:1px solid var(--border)}
  .score-card{grid-template-columns:1fr}
}

/* ---- tips «по опыту сдававших» ---- */
.tip{margin:8px 0 0;font-size:13.5px;color:var(--ink-muted);max-width:56ch}
.tip-tag{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:2px 7px;border-radius:5px;margin-right:8px;vertical-align:1px}

/* ---- scoring table ---- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table.scoring{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.scoring th,table.scoring td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
table.scoring th{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-muted);background:var(--surface-raised)}
table.scoring td:first-child,table.scoring th:first-child{text-align:left;font-weight:600}
table.scoring tr:last-child td{border-bottom:none}

/* ---- multi-task sections ---- */
.tasktabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ttab{font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid var(--border);color:var(--ink-faint)}
.ttab.now{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.ttab.past{color:var(--good);border-color:var(--good)}
.prompt-text{font-size:16.5px;font-weight:600;margin:0 0 8px}
.tclock{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-muted);font-variant-numeric:tabular-nums;padding:4px 9px;border:1px solid var(--border);border-radius:6px;white-space:nowrap}
.tclock.over{color:var(--bad);border-color:var(--bad)}
.script{white-space:pre-line}
.qtag{margin-right:8px;vertical-align:2px}
figure.picture{margin:0 0 14px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-raised)}
figure.picture svg{display:block;width:100%;height:auto}
figure.picture figcaption{font-size:12.5px;color:var(--ink-faint);padding:8px 12px;border-top:1px solid var(--border)}

/* ---- criteria self-scoring ---- */
.crit{margin-top:16px;border-top:1px dashed var(--border-strong);padding-top:12px}
.crit-head{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.crit-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.crit-row:last-of-type{border-bottom:none}
.crit-name{font-size:14px}
.crit-name b{display:block}
.crit-name span{color:var(--ink-muted);font-size:13px}
.crit-btns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cb{font-family:var(--mono);font-size:12.5px;font-weight:600;min-width:30px;height:30px;padding:0 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink-muted);cursor:pointer}
.cb:hover{border-color:var(--accent);color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cb:focus-visible,.btn:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.crit-val{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.crit-sum{font-size:14px;margin-top:10px;text-align:right;color:var(--ink-muted)}
.crit-sum b{color:var(--ink);font-family:var(--mono)}
@media (max-width:560px){.crit-row{grid-template-columns:1fr}.crit-btns{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- player / recorder ---- */
.player .row{align-items:center}
.rec-slot{display:inline-flex;align-items:center;gap:10px}
.rec-slot audio{height:34px;max-width:260px}

/* ---- курс ---- */
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 20px;border-bottom:1px solid var(--border);padding-bottom:12px}
.ctabs a{font-family:var(--mono);font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink-muted);background:var(--surface);border:1px solid var(--border);padding:7px 12px;border-radius:20px}
.ctabs a.on,.ctabs a:hover{color:var(--accent);border-color:var(--accent)}
.ctabs a.on{background:var(--accent-soft)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px}
.wcard{border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--surface);cursor:pointer}
.wcard:hover{border-color:var(--accent)}
.wcard.open{grid-column:1 / -1;background:var(--surface-raised);border-color:var(--accent)}
.wcard.known .lemma{color:var(--good)}.wcard.known .lemma::after{content:" ✓";font-size:12px}
.wcard .wf{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard .lemma{font-weight:600;font-size:15.5px}
.wcard .wb{margin-top:8px;font-size:14.5px}
.wcard .tr{font-weight:600}
.wcard .ex{font-family:var(--serif);font-style:italic;margin-top:4px;color:var(--ink-muted)}
.rule p{margin:0 0 8px;font-size:15px}
.rule table.gt{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 10px}
.rule table.gt th,.rule table.gt td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
.rule table.gt th{background:var(--surface-raised);font-weight:600}
.script.small{font-size:14px;margin:14px 0 6px}
.rec-msg{max-width:46ch}
.aubar{height:6px;border-radius:3px;background:var(--border);margin-top:12px;overflow:hidden}
.aubar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s linear}

/* варианты теста на хабе */
.variants{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
.vchip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;border:1px solid var(--border);color:var(--ink-muted);background:var(--surface)}
.vchip:hover,.vchip:focus-visible{border-color:var(--accent);color:var(--accent)}
.vchip.ok{color:var(--good);border-color:var(--good)}.vchip.warn{color:var(--gold);border-color:var(--gold)}

      script: { title: 'Су ресурстары: тапшылық қайдан келеді?',
        text: 'Қазақстан су ресурстары бойынша Орталық Азиядағы ең осал елдердің қатарында. Ірі өзендеріміздің көпшілігі көрші мемлекеттерден бастау алады, сондықтан су көлемі біздің шешімімізге ғана емес, трансшекаралық келісімдерге де байланысты. Соңғы отыз жылда елдегі жан басына шаққандағы су қоры үштен біріне азайды. Себептер бірнешеу. Біріншісі — климаттың жылынуы: мұздықтардың еруі алдымен су көлемін ұлғайтады, бірақ кейін күрт азайтады. Екіншісі — тиімсіз пайдалану: ауыл шаруашылығы судың жетпіс пайызын тұтынады, ал ескі арықтар жүйесінде судың жартысына жуығы буланып, жерге сіңіп кетеді. Үшіншісі — қалалардың өсуі: ірі қалалардың су тұтынуы он жылда бір жарым есе артты, ал су құбырларының үштен бірі елу жылдан ескі, сондықтан судың бір бөлігі тұтынушыға жетпей жерге кетеді. Кейбір сарапшылар мәселені жаңа су қоймаларын салу арқылы шешуді ұсынады. Алайда су қоймасы суды көбейтпейді, тек қайта бөледі. Менің ойымша, басымдық тамшылатып суару технологиясы мен суды қайта пайдалануға берілуі керек. Бұл қымбат, бірақ жаңа қойма салудан арзан: тамшылатып суаруға көшкен шаруашылықтар су шығынын екі есеге дейін азайтқанын хабарлайды. Ең бастысы, су тапшылығы — техникалық емес, басқарушылық мәселе: біз суды әлі күнге дейін шексіз ресурс сияқты бағалаймыз.',

        { id: 'x5', text: 'Сөз дәлдігі: «Су қоры үштен біріне …». Тиісті етістікті таңдаңыз.', options: ['азайды', 'кеміді', 'екеуі де дұрыс'], answer: 2, explain: 'азаю и кему — синонимы «уменьшиться», оба уместны.', explain_kk: 'азаю мен кему — синонимдер, екеуі де орынды.' },
        { id: 'x6', text: '«Басымдық беру» тіркесінің мағынасын көрсетіңіз.', options: ['Бірінші орынға қою', 'Ақша бөлу', 'Тыйым салу'], answer: 0, explain: 'басымдық беру — отдать приоритет.', explain_kk: 'басымдық беру — бірінші орынға қою.' },

        { id: 'x8', text: '«Буланып кету» сөзінің мәтіндік мағынасы қандай?', options: ['Буға айналып жоғалу', 'Қатып қалу', 'Ағып кету'], answer: 0, explain: 'булану — испаряться.', explain_kk: 'булану — буға айналу.' },
        { id: 'x9', text: 'Паронимдерді ажыратыңыз («пайдалану», «пайдаландыру», «пайдаланылу») және дұрысын қойыңыз: Мемлекет суды тиімді … керек.', options: ['пайдалануы', 'пайдаландыруы', 'пайдаланылуы'], answer: 0, explain: 'пайдалану — использовать (сам субъект); пайдаландыру — заставить использовать; пайдаланылу — быть использованным.', explain_kk: 'пайдалану — субъектінің өзі қолдануы; пайдаландыру — өзгелік етіс; пайдаланылу — ырықсыз етіс.' },

    { type: 'reading', minutes: 15,
      intro: 'Аналитический текст о национальном бренде. Вопросы на сопоставление позиций, вывод из неявной информации и отношение автора.', intro_kk: 'Ұлттық бренд туралы талдамалы мәтін. Ұстанымдарды салыстыруға, астарлы ақпараттан қорытынды шығаруға және автордың көзқарасына қатысты сұрақтар.',
      passage: { title: 'Ұлттық бренд және мәдени дипломатия',
        paragraphs: [
          '«Ұлттық бренд» ұғымы саясаттанушылардың сөздігіне жиырма жыл бұрын ғана енді, бірақ бүгінде ол мемлекеттердің сыртқы саясатының ажырамас бөлігіне айналды. Мәні қарапайым: ел туралы шетелде қалыптасқан бейне инвестицияға, туризмге және дипломатиялық салмаққа тікелей әсер етеді.',
          'Кейбір елдер брендті жарнама арқылы жасауға тырысады: қымбат бейнероликтер, халықаралық көрмелер, спорттық іс-шаралар. Мұндай тәсіл тез нәтиже береді, бірақ ұзаққа бармайды. Ел бейнесін елдің өзі емес, сол елдің адамдары мен мәдениеті қалыптастырады. Кәріс сериалдары мен музыкасы Оңтүстік Кореяны ондаған жарнамалық науқаннан артық танытты, өйткені олар «біз кімбіз» деген сұраққа шынайы жауап берді.',
          'Қазақстанның бұл жолдағы тәжірибесі қайшылықты. Бір жағынан, домбыра мен Димаштың дауысы, көшпенділер тарихы мен дала кеңістігі — әлемге ұсынуға тұрарлық бірегей материал. Екінші жағынан, біз бұл материалды көбіне сыртқы аудиторияға «экспорттық өнім» ретінде ғана қараймыз, ал ішкі аудитория оны күнделікті өмірде аз тұтынады. Осы алшақтық брендті әлсіретеді: шетелдік турист ол көрген «дала романтикасын» қалалық қазақтың өмірінен таба алмай, шатасады.',
          'Мәдени дипломатияның құралдары да белгілі: шетелдегі тіл орталықтары, студенттерге арналған стипендиялар, кино мен музыканың шетелге шығуы, аударма бағдарламалары. Бұл құралдардың бәрі қымбат, бірақ олардың ішінде ең қымбаты да, ең сенімдісі де — аударма: шетелдік оқырман қазақ жазушысын өз тілінде оқығанда ғана ел туралы жарнамасыз түсінік алады.',
          'Мәдени дипломатияның нәтижелі болуы үшін үш шарт қажет. Біріншісі — дәйектілік: бренд сайлаудан сайлауға өзгермеуі тиіс. Екіншісі — қатысу: оны ведомство емес, суретшілер, ғалымдар, кәсіпкерлер жасайды. Үшіншісі — шынайылық: көрсетілетін бейне шын өмірмен сәйкес келуі керек, әйтпесе ол жарнамаға айналады.',
          'Демек, ұлттық бренд — сыртқа бағытталған науқан емес, ішкі мәдени саясаттың айнасы. Ел өз мәдениетін өзі тұтынбаса, оны әлемге сендіре алмайды.'

          'Жылдамдықтың бағасы бар, және оны төлейтін оқырман. Сарапшылар соңғы жылдары ірі порталдардың төртінші жаңалығының біреуі кейін түзетілетінін немесе жойылатынын анықтаған. Түзету, әрине, шығады — бірақ оны алғашқы хабардың оннан бірі де оқымайды. Сөйтіп, қате мен шындық бір мезгілде өмір сүреді, әрі қатенің аудиториясы әрқашан үлкен. Өткен көктемде бір портал ірі кәсіпорынның жабылатыны туралы хабар таратты; екі сағаттан кейін кәсіпорын оны жоққа шығарды, порталдың түзетуі шықты. Бірақ сол екі сағатта хабар мыңдаған рет бөлісілді, ал түзету — жүз шақты рет. Кәсіпорын аман, беделі емес.',
          'Ең қызығы, оқырманның өзі баяу жаңалықты қаламайды. Сауалнамада респонденттердің басым көпшілігі «тексерілген ақпаратты» талап етеді, бірақ дәл солар тексерілмеген хабарды бірінші болып бөліседі. Біз шындықты бағалаймыз, ал жылдамдықты тұтынамыз. Бұл екіжүзділік емес, адам табиғаты: жаңалық — ақпарат емес, эмоция. Эмоция шындықты күтпейді, ол бірінші келгенге жабысады. Редакциялар мұны бізден жақсы біледі, сондықтан тақырыптарда етістіктің орнына леп белгісі тұрады.',
          'Кейбір басылымдар «баяу журналистика» ұранымен шықты: аптасына бір ұзақ мәтін, әр дерек екі дереккөзбен расталған. Идея тамаша, оқырманы аз. Өйткені баяу оқу — дағды, ал дағды жарнамамен емес, әдетпен қалыптасады. Осы жерде мен редакторлармен емес, мектеппен дауласқым келеді: біз балаларды жылдам іздеуге үйретеміз, ал күтуге үйретпейміз. Сабақта «дереккөзді тап» деген тапсырма бар, ал «бір күн күтіп, ертең қайта оқы» деген тапсырма жоқ. Сөйтіп, мектеп бітірген адам ақпаратты табуды біледі, бірақ оны пісуге қалдыруды білмейді.',
          'Маған қарсы шығатындар айтады: жаңалық кешіксе, оның орнын өсек басады. Дұрыс. Бірақ өсек те бірінші болғысы келетін редакциялардың өнімі: олар алдымен өсекті жариялап, кейін оны «тексерілмеген ақпарат» деп атайды. Күте білетін оқырман үшін өсек қауіпті емес, ол тек шыдамсыз аудиторияда өмір сүреді. Демек, өсекпен күрестің ең тиімді құралы — цензура емес, тәрбиеленген шыдам.',
          'Демек, мәселе журналистиканың жылдамдығында емес, оқырманның шыдамында. Жаңалықты жарты сағатқа кешіктірген редакция ештеңе жоғалтпайды — егер оқырман сол жарты сағатты күте алса. Ал күте алмайтын қоғам үшін кез келген жаңалық, тіпті шындық та, тек шу.'
        ], words: 334, note: '≈300 слов, 5 абзацев. C2: скрытый спор с редакторами, оговорка «бұл екіжүзділік емес», перенос проблемы на школу, афористичный финал.' },

        { id: 'r5', kind: 'mc', text: '«Біз шындықты бағалаймыз, ал жылдамдықты тұтынамыз» сөйлемінің мәні қандай?', options: ['Адамдар шындықты сатып алады', 'Сөзде шындықты қалап, іс жүзінде жылдамдықты таңдаймыз', 'Жылдамдық шындықтан қымбат'], answer: 1, explain: 'Противопоставление декларируемого и реального поведения.', explain_kk: 'Жарияланған және нақты мінез-құлықтың қарама-қарсылығы.' },

        { id: 'r7', kind: 'mc', text: 'Автор кіммен дауласқысы келеді?', options: ['Редакторлармен', 'Мектеппен', 'Сарапшылармен'], answer: 1, explain: '«...мен редакторлармен емес, мектеппен дауласқым келеді».' },

        { id: 'r9', kind: 'mc', text: '«Тіпті шындық та, тек шу» деген тіркестегі автордың көзқарасы қандай?', options: ['Шындық қажет емес', 'Шыдамсыз қоғамда шындықтың өзі мәнін жоғалтады', 'Шу шындықтан жақсы'], answer: 1, explain: 'Афористичный финал: без терпения любая новость становится шумом.', explain_kk: 'Афоризм түріндегі соңы: төзімсіз кез келген жаңалық шуға айналады.' },

    'Микрофон не найден: проверьте, что он подключён и выбран в системе.': 'Микрофон табылмады: қосылғанын және жүйеде таңдалғанын тексеріңіз.',

    'Структура по официальным документам; конкретные тексты — тренировочные.': 'Құрылымы ресми құжаттар бойынша; нақты мәтіндер — жаттығуға арналған.',
    '(голоса Aigul и Daulet, Windows и macOS): откройте эту же ссылку в Edge.': '(Aigul және Daulet дауыстары, Windows және macOS): осы сілтемені Edge-те ашыңыз.',
    'Запрашиваю доступ к микрофону… разрешите его во всплывающем окне браузера.': 'Микрофонға рұқсат сұралуда… браузердің қалқымалы терезесінде рұқсат етіңіз.',
    'Рабочая гипотеза по вторичным источникам — звёздочкой помечены цифры, требующие сверки.': 'Қосалқы дереккөздер бойынша жұмыс болжамы — тексеруді қажет ететін сандар жұлдызшамен белгіленген.',

    'Текст скрыт, как на экзамене. Читайте вопросы во время звучания и отмечайте ответы сразу.': 'Мәтін емтихандағыдай жасырылған. Тыңдау кезінде сұрақтарды оқып, жауаптарды бірден белгілеңіз.',
    'Один полный тест на каждую пару «экзамен × уровень», формат и хронометраж — по официальным документам.': 'Әр «емтихан × деңгей» жұбына бір толық тест, форматы мен уақыты — ресми құжаттар бойынша.',
    'В этом браузере нет голоса для казахского языка, кнопка воспроизведения отключена. Бесплатно работает в': 'Бұл браузерде қазақ тілінің дауысы жоқ, ойнату түймесі өшірілген. Тегін жұмыс істейді:',
    'До 15 вопросов: слова темы, окончания из грамматики урока и вопросы к текстам. Порог «тема пройдена» — 70 %.': '15 сұрақа дейін: тақырып сөздері, сабақ грамматикасының жалғаулары және мәтіндерге сұрақтар. «Тақырып өтілді» шегі — 70 %.',
    'Доступ к микрофону запрещён. Нажмите на значок замка или камеры в адресной строке и разрешите микрофон, затем повторите.': 'Микрофонға рұқсат берілмеді. Мекенжай жолындағы құлып немесе камера белгішесін басып, микрофонға рұқсат етіңіз де, қайталаңыз.',
    'секунд, читайте его вслух в темпе диктора и отвечайте по ходу — это слабая замена, но лучше, чем запоминать текст целиком.': 'секунд, оны диктор қарқынымен дауыстап оқып, жауаптарды сол кезде белгілеңіз — бұл әлсіз балама, бірақ мәтінді толық жаттағаннан жақсы.',
    'Похоже, это Edge — подождите пару секунд, голоса подгружаются, или проверьте, что в системе включён «Kazakh» в языках речи.': 'Бұл Edge сияқты — бірнеше секунд күтіңіз, дауыстар жүктелуде, немесе жүйеде сөйлеу тілдерінде «Kazakh» қосылғанын тексеріңіз.',
    'Нажмите на слово, чтобы открыть перевод, толкование и пример. Кнопка ▶ озвучивает слово, если в браузере есть казахский голос.': 'Аудармасын, түсіндірмесін және мысалын ашу үшін сөзді басыңыз. ▶ түймесі браузерде қазақ дауысы болса, сөзді дыбыстайды.',

    'Сгенерированы по таблицам окончаний учебника и ещё не вычитаны носителем: если ответ кажется спорным, отметьте его себе для проверки.': 'Оқулықтың жалғау кестелері бойынша жасалған және тіл иесімен әлі тексерілмеген: жауап даулы көрінсе, тексеру үшін белгілеп қойыңыз.',

/* ============================================================
   Qazaq Trainer — приложение (без фреймворков).
   Маршруты:  #/            хаб
              #/course/:level[/:topic/:tab]  курс по уровням (course.js)
              #/exam/:exam  экзамен: структура + уровни
              #/test/:id    мок-тест: разделы и результаты
              #/test/:id/:section  прохождение раздела
   Прогресс: localStorage 'kz-trainer:v1' + экспорт/импорт JSON.
   ============================================================ */
(function () {
  'use strict';
  var T = KZ.T, LK = KZ.LK;

  /* ---------------- store ---------------- */
  var STORE_KEY = 'kz-trainer:v1';
  function loadState() {
    try { var s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.tests) return s; } catch (e) {}
    return { version: 1, tests: {} };
  }
  function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
  var state = loadState();

  function tp(testId) { return state.tests[testId] || (state.tests[testId] = { sections: {} }); }
  function sp(testId, type) { return tp(testId).sections[type] || null; }
  function setSection(testId, type, data) {
    var t = tp(testId);
    t.sections[type] = Object.assign({}, t.sections[type] || {}, data);
    t.updatedAt = Date.now();
    saveState();
  }
  function clearSection(testId, type) { var t = tp(testId); delete t.sections[type]; saveState(); }

  /* ---------------- настройки интерфейса: язык, размер текста, шрифт, подсказки, транскрипт ---------------- */
  var UI_KEY = 'kz-trainer:ui';
  var ui = { size: 'm', font: 'std', hints: false, transcript: false };
  try { var u0 = JSON.parse(localStorage.getItem(UI_KEY)); if (u0) Object.keys(ui).forEach(function (k) { if (u0[k] != null) ui[k] = u0[k]; }); } catch (e) {}
  function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {} applyUi(); }
  function applyUi() { var h = document.documentElement; h.setAttribute('data-size', ui.size); h.setAttribute('data-font', ui.font); h.classList.toggle('hints', !!ui.hints); h.lang = KZ.lang; }
  applyUi();
  function uiPanel() {
    function seg(act, key, vals, labels) { return '<span class="seg" role="group">' + vals.map(function (v, i) { return '<button class="cb' + (ui[key] === v ? ' on' : '') + '" data-act="' + act + '" data-v="' + v + '" aria-pressed="' + (ui[key] === v) + '">' + labels[i] + '</button>'; }).join('') + '</span>'; }
    return '<div class="uipanel" id="ui-panel" hidden><div class="row"><span class="lbl">' + T('Язык интерфейса') + '</span><span class="seg">' + ['ru', 'kk'].map(function (l) { return '<button class="cb' + (KZ.lang === l ? ' on' : '') + '" data-act="lang" data-v="' + l + '" aria-pressed="' + (KZ.lang === l) + '">' + l.toUpperCase() + '</button>'; }).join('') + '</span></div>' +
      '<div class="row"><span class="lbl">' + T('Размер текста') + '</span>' + seg('ui-size', 'size', ['s', 'm', 'l', 'xl'], ['A−', 'A', 'A+', 'A++']) + '</div>' +
      '<div class="row"><span class="lbl">' + T('Шрифт') + '</span>' + seg('ui-font', 'font', ['std', 'dys'], [T('обычный'), T('для дислексии')]) + '</div>' +
      '<div class="row"><span class="lbl">' + T('Подсказки') + '</span>' + seg('ui-hints', 'hints', [false, true], [T('скрыты'), T('показаны')]) + '</div>' +
      '<div class="row"><span class="lbl">' + T('Транскрипт аудирования') + '</span>' + seg('ui-transcript', 'transcript', [false, true], [T('скрыт'), T('показан')]) + '<span class="hint">' + T('для слабослышащих: текст виден во время звучания') + '</span></div>' +
      '<p class="small muted">' + T('Содержание заданий всегда на казахском языке; переключается только интерфейс.') + '</p></div>';
  }
  function uiButtons() {
    return '<button class="btn ghost small" data-act="lang" data-v="' + (KZ.lang === 'ru' ? 'kk' : 'ru') + '" aria-label="' + T('Язык интерфейса') + '">' + (KZ.lang === 'ru' ? 'KK' : 'RU') + '</button>' +
      '<button class="btn ghost small gear" data-act="ui-panel" aria-expanded="false" aria-controls="ui-panel" title="' + T('Настройки') + '">⚙<span class="sr">' + T('Настройки') + '</span></button>';
  }

  /* ---------------- helpers ---------------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function mmss(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  function letter(i) { return String.fromCharCode(65 + i); }
  function findTest(id) { for (var i = 0; i < KZ.tests.length; i++) if (KZ.tests[i].id === id) return KZ.tests[i]; return null; }
  function examSection(exam, type) { for (var i = 0; i < exam.sections.length; i++) if (exam.sections[i].type === type) return exam.sections[i]; return null; }
  function testsFor(examId, level) { return KZ.tests.filter(function (t) { return t.exam === examId && (!level || t.level === level); }); }
  function wordCount(s) { var m = (s || '').trim().match(/[^\s]+/g); return m ? m.length : 0; }
  function fmtDate(ts) { if (!ts) return ''; var d = new Date(ts); return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }

  /* Итог раздела для карточек: {label, cls} */
  function sectionResult(testId, sec) {
    var r = sp(testId, sec.type);
    if (!r || !r.status) return null;
    if (r.status === 'draft') return { label: T('черновик'), cls: 'mid', pct: null };
    var pct = r.total ? Math.round(100 * r.score / r.total) : null;
    var cls = pct == null ? 'good' : pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad';
    var lbl = r.kind === 'points' ? r.score + '/' + r.total + ' ' + T('баллов') : (sec.type === 'writing' || sec.type === 'speaking') ? T('чек-лист') + ' ' + r.score + '/' + r.total : r.score + '/' + r.total;
    return { label: lbl, cls: cls, pct: pct };
  }
  /* Вердикт по строгой шкале (KZ.strict): все разделы пройдены и в каждом pct >= порога уровня */
  function verdict(t) {
    var need = KZ.strict && KZ.strict.pct && KZ.strict.pct[t.level]; if (!need || !t.sections.length) return null;
    var ex = KZ.exams[t.exam], rows = [], done = 0, pass = true;
    t.sections.forEach(function (s) {
      var r = sp(t.id, s.type), es = examSection(ex, s.type) || {};
      var name = (KZ.lang === 'kk' && es.kk) || es.title || LK(KZ.sectionTypes[s.type], 'label');
      var self = s.type === 'writing' || s.type === 'speaking';
      if (r && r.status === 'done' && r.total) { done++; var pct = Math.round(100 * r.score / r.total); var ok = pct >= need; if (!ok) pass = false; rows.push({ name: name, pct: pct, ok: ok, self: self }); }
      else { pass = false; rows.push({ name: name, pct: null, ok: false, self: self }); }
    });
    return { need: need, rows: rows, done: done, all: done === t.sections.length, pass: pass && done === t.sections.length };
  }
  function verdictCard(t) {
    var v = verdict(t); if (!v) return '';
    var failed = v.rows.filter(function (r) { return r.pct != null && !r.ok; }).map(function (r) { return r.name; }).join(', ');
    var head = v.pass ? T('Уровень подтверждён:') + ' ' + t.level : v.all ? T('Уровень не подтверждён: недостаточно баллов в разделах') + ' ' + failed + '.' : T('Пройдите все разделы, чтобы получить результат по уровню.');
    return '<div class="notice ' + (v.pass ? 'good' : v.all ? '' : 'info') + '"><b class="t">' + T('Результат') + ' · ' + t.level + '</b><p><b>' + head + '</b></p><ul>' +
      v.rows.map(function (r) { return '<li>' + esc(r.name) + ': ' + (r.pct == null ? T('не пройден') : r.pct + ' % ' + (r.ok ? '✓' : '✗')) + (r.self ? ' <span class="muted">· ' + T('самооценка') + '</span>' : '') + '</li>'; }).join('') +
      '</ul></div>';
  }
  function testStatus(test) {
    if (test.status === 'draft') return { label: T('в разработке'), cls: 'muted' };
    var done = 0, any = false;
    test.sections.forEach(function (s) { var r = sp(test.id, s.type); if (r && r.status === 'done') done++; if (r) any = true; });
    if (done === test.sections.length) { var v = verdict(test); if (v) return { label: v.pass ? T('уровень подтверждён') : T('не подтверждён'), cls: v.pass ? 'ok' : 'bad', done: done }; return { label: T('пройден'), cls: 'ok', done: done }; }
    if (any || done) return { label: done + '/' + test.sections.length + ' ' + T('разделов'), cls: 'warn', done: done };
    return { label: T('не начат'), cls: 'muted', done: 0 };
  }

  /* ---------------- timer ---------------- */
  var timer = { iv: null, start: 0, limit: 0, el: null, onTick: null };
  function stopTimer() { if (timer.iv) clearInterval(timer.iv); timer.iv = null; }
  function startTimer(limitSec, onTick) {
    stopTimer();
    timer.start = Date.now(); timer.limit = limitSec; timer.onTick = onTick;
    timer.iv = setInterval(tick, 500); tick();
  }
  function elapsed() { return timer.start ? (Date.now() - timer.start) / 1000 : 0; }
  function tick() {
    var el = document.getElementById('clock'); if (!el) return;
    var left = timer.limit - elapsed();
    el.textContent = left >= 0 ? mmss(left) : '−' + mmss(-left);
    el.className = 'clock' + (left < 0 ? ' over' : left < 60 ? ' warn' : '');
    if (timer.onTick) timer.onTick(elapsed());
    if (left <= 0 && run && run.phase === 'run' && !run.timedOut) timeUp();
  }
  /* Время раздела вышло — раздел закрывается, как на экзамене: ответы фиксируются, письмо/говорение переходят к самопроверке */
  function timeUp() {
    var t = findTest(run.testId); if (!t) return;
    var sec = null; t.sections.forEach(function (x) { if (x.type === run.type) sec = x; }); if (!sec) return;
    run.timedOut = true; run.secondsUsed = Math.round(elapsed()); stopTimer(); stopSpeak(); stopRec();
    var au = document.getElementById('au'); if (au) { try { au.pause(); } catch (e) {} }
    if (qTimer) clearInterval(qTimer); if (tkTimer) clearInterval(tkTimer);
    var ta = document.getElementById('essay'); if (ta) { if (ta.getAttribute('data-task')) { run.texts = run.texts || {}; run.texts[ta.getAttribute('data-task')] = ta.value; } else run.text = ta.value; }
    if (sec.questions) { run.confirmSkip = true; submitQuiz(t, sec); return; }
    if (run.type === 'writing' && !sec.tasks && !run.promptId) { run.promptId = sec.prompts[0].id; run.text = run.text || ''; }
    if (run.type === 'speaking' && !sec.tasks && !run.setId) run.setId = sec.sets[0].id;
    run.sub = 'check'; route();
  }
  function timeUpNotice() {
    return run && run.timedOut ? '<div class="notice"><b class="t">' + T('Время вышло') + '</b><p>' + T('Раздел закрыт по таймеру, как на экзамене: ответы зафиксированы, оцените то, что успели.') + '</p></div>' : '';
  }

  /* ---------------- TTS ---------------- */
  function kkVoices() {
    if (!window.speechSynthesis) return [];
    return speechSynthesis.getVoices().filter(function (v) { return /^kk/i.test(v.lang) || /kazakh|қазақ/i.test(v.name); });
  }
  function kkVoice() {
    var vs = kkVoices(); if (!vs.length) return null;
    var pref = state.voice; for (var i = 0; i < vs.length; i++) if (vs[i].name === pref) return vs[i];
    for (var j = 0; j < vs.length; j++) if (/natural|neural|online/i.test(vs[j].name)) return vs[j];
    return vs[0];
  }
  var ttsUtter = null;
  function speak(text, onEnd) {
    var v = kkVoice(); if (!v) return false;
    speechSynthesis.cancel();
    // Кусками по абзацам/репликам — длинные фразы некоторые движки обрывают.
    var parts = text.split(/\n+/).filter(function (x) { return x.trim(); });
    var i = 0;
    function next() {
      if (i >= parts.length) { ttsUtter = null; if (onEnd) onEnd(true); return; }
      var u = new SpeechSynthesisUtterance(parts[i++]); u.voice = v; u.lang = v.lang || 'kk-KZ'; u.rate = 0.92;
      u.onend = next; u.onerror = function () { ttsUtter = null; if (onEnd) onEnd(false); };
      ttsUtter = u; speechSynthesis.speak(u);
    }
    next(); return true;
  }
  function stopSpeak() { if (window.speechSynthesis) speechSynthesis.cancel(); ttsUtter = null; }
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function () { if (run && run.type === 'listening' && run.phase === 'run' && !run.playing) route(); };
  var isEdge = /Edg\//.test(navigator.userAgent);

  /* ---------------- перемешивание вариантов ответа ----------------
     В данных ключ часто стоит первым. Один раз при загрузке переставляем варианты детерминированно
     (сид = id теста + id вопроса), чтобы порядок был стабилен между сессиями и разбор совпадал с сохранёнными ответами. */
  function seedOf(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function seededPerm(n, seed) { var a = []; for (var i = 0; i < n; i++) a.push(i); var x = seed || 1; for (var j = n - 1; j > 0; j--) { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; var k = (x >>> 0) % (j + 1); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
  function shuffleQuestion(q, key) {
    if (!q || q.kind === 'tf' || !q.options || q.options.length < 2 || q._shuffled) return;
    var perm = seededPerm(q.options.length, seedOf(key));
    q.options = perm.map(function (i) { return q.options[i]; });
    q.answer = perm.indexOf(q.answer); q._shuffled = true;
  }
  KZ.shuffleQuestion = shuffleQuestion;
  KZ.tests.forEach(function (t) { t.sections.forEach(function (sec) { (sec.questions || []).forEach(function (q) { shuffleQuestion(q, t.id + '/' + sec.type + '/' + q.id); }); }); });
  if (KZ.courses) Object.keys(KZ.courses).forEach(function (lv) { KZ.courses[lv].topics.forEach(function (tp) {
    tp.grammar.forEach(function (g) { g.tasks.forEach(function (x, i) { shuffleQuestion(x, lv + '/' + g.id + '/' + i); }); });
    tp.texts.forEach(function (tx) { tx.questions.forEach(function (x, i) { shuffleQuestion(x, lv + '/' + tx.id + '/' + i); }); });
  }); });

  /* ---------------- router ---------------- */
  var run = null; // runtime state of the open section
  var qTimer = null; // per-question timer in speaking
  var tkTimer = null; // per-task timer in speaking (tasks)
  var extRoutes = [];
  KZ.registerRoute = function (fn) { extRoutes.push(fn); };
  var extRun = {};
  KZ.run = function () { return extRun; };
  KZ.resetRun = function (init) { extRun = init || {}; return extRun; };
  KZ.route = function () { route(); };
  KZ.speak = function (text) { return speak(text); };
  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    var p = h.split('/').filter(Boolean);
    var sameSection = run && p[0] === 'test' && p[1] === run.testId && p[2] === run.type;
    if (!sameSection) { stopTimer(); if (qTimer) clearInterval(qTimer); if (tkTimer) clearInterval(tkTimer); run = null; stopSpeak(); stopRec(); }
    var app = document.getElementById('app');
    var html;
    var extHtml = null;
    for (var ei = 0; ei < extRoutes.length && extHtml == null; ei++) extHtml = extRoutes[ei](p);
    if (extHtml != null) { run = null; html = extHtml; }
    else if (p[0] === 'sources') html = viewSources();
    else if (p[0] === 'exam' && KZ.exams[p[1]]) html = viewExam(KZ.exams[p[1]]);
    else if (p[0] === 'test' && findTest(p[1]) && !p[2]) html = viewTest(findTest(p[1]));
    else if (p[0] === 'test' && findTest(p[1]) && p[2]) html = viewSection(findTest(p[1]), p[2]);
    else html = viewHub();
    app.innerHTML = html;
    window.scrollTo(0, 0);
    if (run && run.afterRender) run.afterRender();
    fillRecSlots();
  }
  window.addEventListener('hashchange', route);

  function crumbs(items) {
    var out = [];
    items.forEach(function (it, i) {
      if (i) out.push('<span class="sep">/</span>');
      out.push(it.href ? '<a href="' + it.href + '">' + esc(it.label) + '</a>' : '<b>' + esc(it.label) + '</b>');
    });
    return '<div class="crumbs">' + out.join('') + '</div>';
  }
  function topbar(items, right) {
    return '<a class="skip" href="#main">' + T('К содержимому') + '</a><div class="topbar"><nav aria-label="' + T('Навигация') + '">' + crumbs(items) + '</nav><div class="row">' + (right || '') + uiButtons() + '</div></div>' + uiPanel() + '<div id="main"></div>';
  }

  /* ---------------- views: hub ---------------- */
  function viewHub() {
    var cards = KZ.examOrder.map(function (eid) {
      var ex = KZ.exams[eid];
      var rows = (ex.examLevels || KZ.levelOrder).map(function (lv) {
        var tests = testsFor(eid, lv);
        var t = tests[0];
        var st = t ? testStatus(t) : { label: T('нет теста'), cls: 'muted' };
        var href = t && t.status !== 'draft' ? '#/test/' + t.id : '#/exam/' + eid;
        // несколько вариантов уровня: чипы «1 · 2 · 3» со статусом каждого
        var chips = tests.length > 1 ? '<span class="variants">' + tests.map(function (x, i) { var sx = testStatus(x); return '<span class="vchip ' + sx.cls + '" role="link" tabindex="0" data-act="go" data-href="#/test/' + x.id + '" title="' + esc(LK(x, 'title')) + ' · ' + esc(sx.label) + '">' + (i + 1) + '</span>'; }).join('') + '</span>' : '';
        return '<a class="level-row' + (t && t.status === 'draft' ? ' draft' : '') + '" href="' + href + '">' +
          '<span class="lvl">' + lv + '</span>' +
          '<span><div class="nm">' + esc(LK(KZ.levels[lv], 'name')) + (tests.length > 1 ? ' <span class="muted small">· ' + tests.length + ' ' + T('варианта') + '</span>' : '') + '</div><div class="dsc">' + esc(t ? LK(t, 'summary') : '') + '</div></span>' +
          '<span class="st">' + chips + '<span class="badge ' + st.cls + '">' + st.label + '</span></span></a>';
      }).join('');
      return '<div class="exam-card-wrap"><a class="exam-card" href="#/exam/' + eid + '">' +
        '<div class="row spread"><span class="badge exam">' + esc(ex.kicker) + '</span>' +
        (ex.verified ? '<span class="badge ok">' + T('структура подтверждена') + '</span>' : '<span class="badge warn">' + T('структура не подтверждена') + '</span>') + '</div>' +
        '<div class="name">' + esc(ex.name) + '</div><p class="tag">' + esc(LK(ex, 'tagline')) + '</p></a>' +
        '<div class="levels" style="margin-top:10px">' + rows + '</div></div>';
    }).join('');

    return topbar([{ label: T('Хаб') }], '<button class="btn ghost small" data-act="io">' + T('Прогресс: экспорт / импорт') + '</button>') +
      '<div class="kicker">' + T('Qazaq trainer · тренажёр') + '</div>' +
      '<h1>' + T('Подготовка к государственным экзаменам по казахскому языку') + '</h1>' +
      '<p class="lede">' + T('Два экзамена, уровни от A1 до C2, по несколько вариантов мок-теста на каждый уровень. Результаты по разделам сохраняются в этом браузере; для переноса на другое устройство есть экспорт.') + '</p>' +
      '<div id="io-panel" hidden>' + ioPanel() + '</div>' +
      courseCards() +
      '<section><div class="kicker" style="margin-bottom:8px">' + T('Экзамены') + '</div><h2>' + T('Мок-тесты по уровням') + '</h2><p class="sub">' + T('Один полный тест на каждую пару «экзамен × уровень», формат и хронометраж — по официальным документам.') + '</p><div class="grid2">' + cards + '</div></section>' +
      '<section><div class="kicker" style="margin-bottom:8px">' + T('Шкала') + '</div><h2>' + T('Как отличаются уровни в тренажёре') + '</h2>' +
      '<p class="sub">' + T('Объём лексики — по методике ҚАЗТЕСТ (testcenter.kz). Остальное — рабочие критерии дифференциации заданий, а не официальные требования.') + '</p>' +
      '<div class="ladder">' + KZ.levelOrder.map(function (lv) { var L = KZ.levels[lv]; return '<div class="rung"><div class="rung-level">' + lv + '</div><div class="rung-name">' + esc(LK(L, 'name')) + '</div><div class="rung-units">' + esc(LK(L, 'units')) + '</div><div class="rung-focus">' + esc(LK(L, 'focus')) + '</div></div>'; }).join('') + '</div></section>' +
      '<footer><p><a href="#/sources">' + T('Литература и источники') + '</a>' + (KZ.site && KZ.site.feedbackTelegram ? ' · <a href="https://t.me/' + esc(KZ.site.feedbackTelegram) + '" target="_blank" rel="noopener">' + T('Написать в Telegram') + '</a>' : '') + (KZ.site && KZ.site.siteUrl && location.protocol !== 'https:' && location.hostname !== 'localhost' ? ' · <a href="' + esc(KZ.site.siteUrl) + '" target="_blank" rel="noopener">' + T('Открыть сайт отдельной вкладкой') + '</a>' : '') + '</p>' + T('Форматы заданий везде — рабочая реконструкция по опубликованной структуре тестов, а не копия реального интерфейса. Подтверждённые и неподтверждённые факты помечены на странице каждого экзамена.') + '</footer>';
  }
  function courseCards() {
    if (!KZ.courses) return '';
    var keys = Object.keys(KZ.courses); if (!keys.length) return '';
    return '<section><div class="kicker" style="margin-bottom:8px">' + T('Курс') + '</div><h2>' + T('Учебная программа по уровням') + '</h2><p class="sub">' + T('Программа построена на нашей методологии, разработанной с опорой на официальный лексический минимум ҰТО и типовые учебники уровней; по каждой теме — карточки слов, грамматика с заданиями, тексты с вопросами и итоговый тест.') + '</p><div class="grid2">' + keys.map(function (k) {
      var c = KZ.courses[k], pr = KZ.courseProgress ? KZ.courseProgress(c) : null;
      return '<a class="exam-card" href="#/course/' + k + '"><div class="row spread"><span class="badge level">' + k + '</span>' + (pr ? '<span class="badge ' + (pr.done ? 'ok' : 'muted') + '">' + pr.done + ' / ' + pr.topics + ' ' + T('тем') + '</span>' : '') + '</div><div class="name">' + esc(c.title) + ' · ' + esc(c.kk) + '</div><p class="tag">' + c.topics.length + ' ' + T('тем') + ' · ' + (c.stats.uniqueWords || c.stats.words) + ' ' + T('слов') + (c.coverage ? ' (' + LK(c, 'coverage') + ')' : '') + ' · ' + c.stats.grammar + ' ' + T('грамматических тем') + ' · ' + c.stats.texts + ' ' + T('текстов') + (c.stats.textsWithQuestions != null ? ', ' + T('с вопросами') + ' ' + c.stats.textsWithQuestions : '') + (pr && pr.known ? ' · ' + T('выучено') + ' ' + pr.known : '') + '</p></a>';
    }).join('') + '</div></section>';
  }
  function ioPanel() {
    return '<div class="block io"><h3>' + T('Экспорт и импорт прогресса') + '</h3>' +
      '<p class="small muted">' + T('Скопируйте JSON и сохраните где удобно; на другом устройстве вставьте его в поле и нажмите «Импортировать». Импорт заменяет текущий прогресс.') + '</p>' +
      '<textarea id="io-text">' + esc(JSON.stringify(state)) + '</textarea>' +
      '<div class="actions"><button class="btn small" data-act="io-copy">' + T('Скопировать') + '</button><button class="btn secondary small" data-act="io-import">' + T('Импортировать из поля') + '</button><button class="btn danger small" data-act="io-reset">' + T('Сбросить весь прогресс') + '</button><span class="hint" id="io-msg"></span></div></div>';
  }

  /* ---------------- views: exam ---------------- */
  function viewExam(ex) {
    var stages = ex.sections.map(function (s) {
      return '<div class="stage' + (s.hypothetical ? ' locked' : '') + '"><div class="stage-num">' + s.num + '</div><div><p class="stage-name">' + esc(KZ.lang === 'kk' ? s.kk : s.title) + (KZ.lang === 'kk' ? '' : ' <span class="muted small">' + esc(s.kk) + '</span>') + (s.hypothetical ? ' <span class="badge warn">' + T('гипотеза') + '</span>' : '') + '</p><p class="stage-desc">' + esc(LK(s, 'desc')) + '</p>' + tipsInline(s) + '</div>' +
        '<div class="stage-meta"><div class="stage-time">' + (s.minutes == null ? '—' : esc(s.minutes) + ' ' + T('мин')) + '</div><div class="stage-tasks">' + esc(LK(s, 'tasks')) + '</div></div></div>';
    }).join('');
    var levels = (ex.examLevels || KZ.levelOrder).map(function (lv) {
      var tests = testsFor(ex.id, lv);
      return tests.map(function (t) {
        var st = testStatus(t);
        var href = t.status === 'draft' ? '#/exam/' + ex.id : '#/test/' + t.id;
        return '<a class="level-row' + (t.status === 'draft' ? ' draft' : '') + '" href="' + href + '"><span class="lvl">' + lv + '</span><span><div class="nm">' + esc(LK(t, 'title')) + ' · ' + esc(LK(KZ.levels[lv], 'name')) + '</div><div class="dsc">' + esc(LK(t, 'summary')) + '</div></span><span class="st"><span class="badge ' + st.cls + '">' + st.label + '</span></span></a>';
      }).join('');
    }).join('');
    return topbar([{ label: T('Хаб'), href: '#/' }, { label: ex.short }]) +
      '<div class="kicker">' + esc(ex.kicker) + '</div><h1>' + esc(ex.name) + '</h1><p class="lede">' + esc(LK(ex, 'tagline')) + '</p>' +
      '<div class="notice ' + (ex.verified ? 'good' : '') + '"><b class="t">' + (ex.verified ? T('Подтверждено') : T('Не подтверждено')) + '</b><p>' + esc(LK(ex, 'verifiedNote')) + '</p></div>' +
      '<section><h2>' + T('Структура теста') + '</h2><p class="sub">' + (ex.verified ? T('По официальному описанию.') : T('Рабочая гипотеза по вторичным источникам — звёздочкой помечены цифры, требующие сверки.')) + '</p>' +
      '<div class="stages">' + stages + (ex.totalMinutes ? '<div class="stages-total"><span>' + T('Итого') + '</span><b>' + ex.totalMinutes + ' ' + T('минут') + ' · ' + ex.sections.length + ' ' + (ex.sections.length === 4 ? T('блока') : T('разделов')) + (ex.totalTasks ? ' · ' + ex.totalTasks + ' ' + T('задания') : '') + '</b></div>' : '') + '</div>' +
      (ex.mockNote ? '<p class="small muted mt">' + esc(LK(ex, 'mockNote')) + '</p>' : '') + '</section>' +
      (ex.scoring ? scoringTable(ex) : '') +
      (KZ.site && KZ.site.demo ? '' : '<section><h2>' + T('Что официально не опубликовано') + '</h2><div class="notice"><b class="t">' + T('Рабочая реконструкция') + '</b><ul>' + ex.unverified.map(function (u) { return '<li>' + esc(u) + '</li>'; }).join('') + '</ul></div></section>') +
      '<section><h2>' + T('Мок-тесты') + '</h2><div class="levels">' + levels + '</div></section>' +
      '<footer>' + T('Источники:') + '<ul class="srclist">' + ex.sources.map(function (s) { return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(LK(s, 'title')) + '</a></li>'; }).join('') + '</ul></footer>';
  }

  /* ---------------- views: test ---------------- */
  function viewTest(t) {
    var ex = KZ.exams[t.exam];
    var st = testStatus(t);
    var stages = t.sections.map(function (s, i) {
      var es = examSection(ex, s.type) || {};
      var r = sectionResult(t.id, s);
      var meta = es.num || ('0' + (i + 1));
      return '<a class="stage" href="#/test/' + t.id + '/' + s.type + '"><div class="stage-num">' + meta + '</div><div><p class="stage-name">' + esc((KZ.lang === 'kk' && es.kk) || es.title || LK(KZ.sectionTypes[s.type], 'label')) + '</p><p class="stage-desc">' + esc(LK(s, 'intro')).slice(0, 140) + '…</p></div>' +
        '<div class="stage-meta"><div class="stage-time">' + s.minutes + ' ' + T('мин') + '</div><div class="stage-tasks">' + esc(LK(es, 'tasks') || '') + '</div>' +
        (r ? '<div class="stage-score ' + r.cls + '">' + esc(r.label) + '</div>' : '<div class="stage-score muted">' + T('не пройден') + '</div>') + '</div></a>';
    }).join('');
    var total = t.sections.reduce(function (a, s) { return a + (s.minutes || 0); }, 0);
    return topbar([{ label: T('Хаб'), href: '#/' }, { label: ex.short, href: '#/exam/' + ex.id }, { label: t.level + ' · ' + LK(t, 'title') }],
        '<span class="badge level">' + t.level + '</span><span class="badge ' + st.cls + '">' + st.label + '</span>') +
      '<div class="kicker">' + esc(ex.kicker) + ' · ' + T('уровень') + ' ' + t.level + '</div><h1>' + esc(LK(t, 'title')) + ' — ' + esc(LK(KZ.levels[t.level], 'name')) + '</h1>' +
      '<p class="lede">' + esc(LK(t, 'summary')) + ' ' + T('Разделы можно проходить по порядку, как на экзамене, или по одному. Ответы фиксируются один раз, после этого открывается разбор.') + '</p>' +
      verdictCard(t) +
      '<div class="stages">' + stages + '<div class="stages-total"><span>' + T('Итого') + '</span><b>' + total + ' ' + T('минут') + ' · ' + t.sections.length + (t.sections.length === 4 ? ' ' + T('блока') : ' ' + T('разделов')) + '</b></div></div>' +
      '<div class="actions"><button class="btn danger small" data-act="reset-test" data-test="' + t.id + '">' + T('Сбросить результаты этого теста') + '</button>' +
      (tp(t.id).updatedAt ? '<span class="hint">' + T('последнее изменение:') + ' ' + fmtDate(tp(t.id).updatedAt) + '</span>' : '') + '</div>';
  }

  /* ---------------- views: section ---------------- */
  function viewSection(t, type) {
    var sec = null; t.sections.forEach(function (s) { if (s.type === type) sec = s; });
    if (!sec) return viewTest(t);
    var ex = KZ.exams[t.exam];
    var es = examSection(ex, type) || {};
    var saved = sp(t.id, type);
    if (!run || run.testId !== t.id || run.type !== type) {
      run = { testId: t.id, type: type, phase: saved && saved.status === 'done' ? 'review' : 'ready', answers: {}, sub: 'script' };
      if (saved && saved.status === 'draft') { run.phase = 'run'; run.resume = true; }
    }
    var head = topbar([{ label: T('Хаб'), href: '#/' }, { label: ex.short, href: '#/exam/' + ex.id }, { label: t.level + ' · ' + LK(t, 'title'), href: '#/test/' + t.id }, { label: (KZ.lang === 'kk' && es.kk) || es.title || type }],
      '<span class="badge level">' + t.level + '</span>' + sectionDots(t, type));
    var title = '<div class="kicker">' + T('Раздел') + ' ' + (es.num || '') + ' · ' + es.kk + '</div><h1>' + esc((KZ.lang === 'kk' && es.kk) || es.title || LK(KZ.sectionTypes[type], 'label')) + '</h1>' +
      '<p class="lede' + (run.phase === 'ready' ? '' : ' hintx') + '">' + esc(LK(sec, 'intro')) + '</p>';
    title += timeUpNotice();
    var body;
    if (run.phase === 'ready') body = viewReady(t, sec, es);

  /* --- вопросы с выбором (общие для listening / lexis / reading) --- */
  function renderQuestions(sec, answers, locked, startNum) {
    return sec.questions.map(function (q, i) {
      var num = startNum ? startNum : i + 1;

        (locked ? (chosen === q.answer ? '<span class="verdict ok">✓ ' + T('верно') + '</span>' : '<span class="verdict no">✗ ' + T('неверно') + '</span>') : '') + '</p><ul class="opts" lang="kk">';
      opts.forEach(function (o, j) {
        var cls = 'opt';
        if (locked) { cls += ' locked'; if (j === q.answer) cls += ' correct'; else if (j === chosen) cls += ' wrong'; }
        else if (j === chosen) cls += ' selected';
        html += '<li><label class="' + cls + '"><input type="radio" name="' + q.id + '" value="' + j + '"' + (j === chosen ? ' checked' : '') + (locked ? ' disabled' : '') + '><span class="k">' + letter(j) + '</span><span>' + esc(o) + '</span></label></li>';
      });
      html += '</ul>';

  function runQuiz(t, sec, es) {

  }

  function transcriptBlock(sec) {

  function playAudio(t, sec, btn) {
    var plays = sec.plays || Infinity; // повтор не ограничен, пока идёт время раздела (ҚАЗТЕСТ: «мәтін бірнеше рет тыңдалады»; QRT: видео в пределах 10 минут)

    var pb = document.getElementById('au-pause'); if (pb) { pb.hidden = false; pb.textContent = '⏸ ' + T('Пауза'); }

    a.ontimeupdate = function () { var bar = document.getElementById('aubar'); if (bar && a.duration) bar.style.width = (100 * a.currentTime / a.duration) + '%'; };
    var finished = false;
    function finish() { if (finished) return; finished = true; run.playing = false; run.playsUsed++; route(); }
    a.onended = finish;
    a.onpause = function () { if (!finished && a.duration && a.currentTime >= a.duration - 0.75) finish(); };
    a.onerror = function () { run.playing = false; var m = document.getElementById('tts-msg'); if (m) m.textContent = T('Не удалось воспроизвести аудио.'); btn.disabled = false; btn.textContent = '▶ ' + T('Воспроизвести'); };

      if (!run.audioRetried) { // вторая попытка с абсолютным адресом и явной загрузкой (Safari иногда отвечает NotSupportedError на первый play())

      }

  function playScript(t, sec) {
    var plays = sec.plays || Infinity; // повтор не ограничен, пока идёт время раздела (ҚАЗТЕСТ: «мәтін бірнеше рет тыңдалады»; QRT: видео в пределах 10 минут)
    if (run.playsUsed >= plays || run.playing) return;

  }
  function showScriptTimed(t, sec) {
    var plays = sec.plays || Infinity; // повтор не ограничен, пока идёт время раздела (ҚАЗТЕСТ: «мәтін бірнеше рет тыңдалады»; QRT: видео в пределах 10 минут)

  /* --- письмо --- */

  function updateSkel(sec) {

  /* --- интервью --- */
  function runSpeaking(t, sec, es) {

    if (run.setId == null) run.setId = saved.setId || null;

    if (run.qdone == null) run.qdone = {};

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function makeVocabQuiz(tp, p, n) {
