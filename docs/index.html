  }
  function runQuiz(t, sec, es) {
    var body = '';
    if (sec.passage) {
      body += '<div class="block"><div class="passage-title">Мәтін · ' + esc(sec.passage.title) + '</div><div class="passage">' + sec.passage.paragraphs.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div></div>';  // passage.note — служебная пометка о калибровке, в интерфейс не выводится
    }
    body += '<div class="block"><span class="setlabel">' + T('Задания') + '</span>' + renderQuestions(sec, run.answers, false) +
      '<div class="actions"><button class="btn" data-act="submit">' + T('Зафиксировать ответы') + '</button><span class="hint" id="submit-msg" role="status" aria-live="polite"></span></div></div>';
    run.afterRender = function () { quizTimer(t, sec); };

  }
  /* черновик раздела с выбором ответов: ответы и момент старта таймера переживают перезагрузку и уход со страницы */
  function quizDraft() {
    if (!run || run.phase !== 'run' || !timer.start) return;
    var t = findTest(run.testId), sec = null; if (t) t.sections.forEach(function (s) { if (s.type === run.type) sec = s; });
    if (!sec || !sec.questions) return;
    setSection(run.testId, run.type, { status: 'draft', answers: run.answers, startedAt: timer.start, playsUsed: run.playsUsed || 0 });
  }
  function quizTimer(t, sec) {
    if (timer.iv) { tick(); return; }
    startTimer(sec.minutes * 60);
    var d = sp(t.id, sec.type);
    if (run.resume && d && d.startedAt) { timer.start = d.startedAt; tick(); } else quizDraft();
  }
  function runListening(t, sec, es) {
    var plays = sec.plays || Infinity; // повтор не ограничен, пока идёт время раздела (ҚАЗТЕСТ: «мәтін бірнеше рет тыңдалады»; QRT: видео в пределах 10 минут)
    if (run.playsUsed == null) run.playsUsed = 0;
    var voice = kkVoice(), left = plays - run.playsUsed;
    var head;
    var au = KZ.audio && KZ.audio[t.id];
    if (au) {
      head = '<div class="block player"><span class="setlabel">' + T('Аудио') + ' · ' + esc(sec.script.title) + '</span>' +
        '<div class="row"><button class="btn" data-act="au-play"' + (left <= 0 || run.playing ? ' disabled' : '') + '>▶ ' + (run.playing ? T('Звучит…') : T('Воспроизвести')) + '</button>' +
        '<button class="btn ghost small" data-act="au-pause" id="au-pause"' + (run.playing ? '' : ' hidden') + '>⏸ ' + T('Пауза') + '</button>' +
        '<span class="hint" id="tts-msg" role="status" aria-live="polite">' + (left > 0 ? (plays === Infinity ? T('повтор доступен, пока идёт время раздела') : T('прослушиваний осталось:') + ' ' + left + ' ' + T('из') + ' ' + plays) : T('прослушивания исчерпаны — зафиксируйте ответы')) + ' · ' + mmss(au.seconds) + ' · ' + (/[,\/+]/.test(String(au.voices)) ? T('голоса') : T('голос:')) + ' ' + esc(au.voices) + '</span></div>' +
        '<div class="aubar" aria-hidden="true"><i id="aubar"></i></div><audio id="au" preload="auto" src="' + au.src + '"></audio>' + transcriptBlock(sec) +
        '<p class="small muted mt hintx">' + T('Текст скрыт, как на экзамене: читайте вопросы и отмечайте ответы по ходу звучания. Паузу поставить можно, перемотки нет; прослушивание засчитывается, когда запись дозвучала до конца.') + (plays === Infinity ? ' ' + T('Повторять запись можно, пока идёт время раздела.') : plays > 1 ? ' ' + T('Прослушиваний:') + ' ' + plays + '.' : ' ' + T('Запись звучит один раз.')) + '</p></div>';
    } else if (voice) {
      head = '<div class="block player"><span class="setlabel">' + T('Аудио') + ' · ' + esc(sec.script.title) + '</span>' +
        '<div class="row"><button class="btn" data-act="tts"' + (left <= 0 || run.playing ? ' disabled' : '') + '>▶ ' + (run.playing ? T('Звучит…') : T('Воспроизвести')) + '</button>' +
        (run.playing ? '<button class="btn ghost small" data-act="tts-pause">' + (window.speechSynthesis && speechSynthesis.paused ? '▶ ' + T('Продолжить') : '⏸ ' + T('Пауза')) + '</button><button class="btn ghost small" data-act="tts-stop">■ ' + T('Остановить') + '</button>' : '') +
        '<span class="hint" id="tts-msg" role="status" aria-live="polite">' + (left > 0 ? (plays === Infinity ? T('повтор доступен, пока идёт время раздела') : T('прослушиваний осталось:') + ' ' + left + ' ' + T('из') + ' ' + plays) : T('прослушивания исчерпаны — зафиксируйте ответы')) + ' · ' + T('голос:') + ' ' + esc(voice.name) + '</span></div>' +
        transcriptBlock(sec) +
        (kkVoices().length > 1 ? '<div class="row mt small"><span class="muted">' + T('Голос:') + '</span>' + kkVoices().map(function (v) { return '<button class="cb' + (v === voice ? ' on' : '') + '" data-act="voice" data-name="' + esc(v.name) + '">' + esc(v.name.replace(/Microsoft |Online |\(Natural\)| - Kazakh.*$/g, '').trim()) + '</button>'; }).join('') + '</div>' : '') +
        '<p class="small muted mt hintx">' + T('Текст скрыт, как на экзамене. Читайте вопросы во время звучания и отмечайте ответы сразу.') + (plays === Infinity ? ' ' + T('Повторять запись можно, пока идёт время раздела.') : plays > 1 ? ' ' + T('Прослушиваний:') + ' ' + plays + '.' : ' ' + T('Запись звучит один раз.')) + '</p></div>';
    } else {
      head = '<div class="notice"><b class="t">' + T('Казахский голос не найден') + '</b><p>' + T('В этом браузере нет голоса для казахского языка, кнопка воспроизведения отключена. Бесплатно работает в') + ' <b>Microsoft Edge</b> ' + T('(голоса Aigul и Daulet, Windows и macOS): откройте эту же ссылку в Edge.') + (isEdge ? ' ' + T('Похоже, это Edge — подождите пару секунд, голоса подгружаются, или проверьте, что в системе включён «Kazakh» в языках речи.') : '') + '</p>' +
        '<p>' + T('Запасной режим без голоса: текст покажется на') + ' ' + (sec.script.readSeconds || 90) + ' ' + T('секунд, читайте его вслух в темпе диктора и отвечайте по ходу — это слабая замена, но лучше, чем запоминать текст целиком.') + '</p>' +
        '<div class="actions"><button class="btn secondary small" data-act="show-script"' + (left <= 0 || run.scriptVisible ? ' disabled' : '') + '>' + T('Показать текст на') + ' ' + (sec.script.readSeconds || 90) + ' ' + T('с') + '</button><span class="hint" role="status">' + (plays === Infinity ? T('повтор доступен, пока идёт время раздела') : T('показов осталось:') + ' ' + left + ' ' + T('из') + ' ' + plays) + '</span></div></div>' +
        (run.scriptVisible ? '<div class="block"><span class="setlabel">' + T('Скрипт') + ' · <span id="script-left"></span></span><div class="script">' + esc(sec.script.text) + '</div></div>' : '');
    }
    var body = '<div class="block"><span class="setlabel">' + T('Задания') + '</span>' + renderQuestions(sec, run.answers, false) +
      '<div class="actions"><button class="btn" data-act="submit">' + T('Зафиксировать ответы') + '</button><span class="hint" id="submit-msg" role="status" aria-live="polite"></span></div></div>';
    run.afterRender = function () { quizTimer(t, sec); };
    return timerBar(sec) + head + body;
  }
  function transcriptBlock(sec) {
    return '<div class="row mt"><button class="btn ghost small" data-act="ui-transcript" data-v="' + (!ui.transcript) + '" aria-pressed="' + (!!ui.transcript) + '">' + (ui.transcript ? T('Скрыть транскрипт') : T('Показать транскрипт (для слабослышащих)')) + '</button></div>' +
      (ui.transcript ? '<div class="script" lang="kk" aria-live="off">' + esc(sec.script.text) + '</div>' : '');
  }
  function playAudio(t, sec, btn) {
    var plays = sec.plays || Infinity; // повтор не ограничен, пока идёт время раздела (ҚАЗТЕСТ: «мәтін бірнеше рет тыңдалады»; QRT: видео в пределах 10 минут)
    if (run.playsUsed >= plays || run.playing) return;
    var a = document.getElementById('au'); if (!a) return;
    run.playing = true; btn.disabled = true; btn.textContent = '▶ ' + T('Звучит…');
    var pb = document.getElementById('au-pause'); if (pb) { pb.hidden = false; pb.textContent = '⏸ ' + T('Пауза'); }
    a.currentTime = 0;
    a.ontimeupdate = function () { var bar = document.getElementById('aubar'); if (bar && a.duration) bar.style.width = (100 * a.currentTime / a.duration) + '%'; };
    var finished = false;
    function finish() { if (finished) return; finished = true; run.playing = false; run.playsUsed++; quizDraft(); route(); }
    a.onended = finish;
    a.onpause = function () { if (!finished && a.duration && a.currentTime >= a.duration - 0.75) finish(); };
    a.onerror = function () { run.playing = false; var m = document.getElementById('tts-msg'); if (m) m.textContent = T('Не удалось воспроизвести аудио.'); btn.disabled = false; btn.textContent = '▶ ' + T('Воспроизвести'); };
    var pr = a.play(); if (pr && pr.catch) pr.catch(function (e) {
      run.playing = false; btn.disabled = false; btn.textContent = '▶ ' + T('Воспроизвести');
      if (!run.audioRetried) { // вторая попытка с абсолютным адресом и явной загрузкой (Safari иногда отвечает NotSupportedError на первый play())
        run.audioRetried = true; try { a.src = new URL(a.getAttribute('src'), location.href).href; a.load(); } catch (x) {}
        setTimeout(function () { playAudio(t, sec, btn); }, 400); return;
      }
      var m = document.getElementById('tts-msg'); if (m) m.innerHTML = esc((e && e.name === 'NotSupportedError') || (a.error && a.error.code === 4) ? T('Аудиофайл не найден или не поддерживается браузером.') : T('Браузер заблокировал воспроизведение:') + ' ' + (e && e.name ? e.name : e)) + ' <a href="' + esc(a.currentSrc || a.src) + '" target="_blank" rel="noopener">' + T('Открыть аудио отдельной вкладкой') + '</a>';
    });
  }
  function playScript(t, sec) {
    var plays = sec.plays || Infinity; // повтор не ограничен, пока идёт время раздела (ҚАЗТЕСТ: «мәтін бірнеше рет тыңдалады»; QRT: видео в пределах 10 минут)
    if (run.playsUsed >= plays || run.playing) return;
    run.playing = true;
    var ok = speak(sec.script.text, function () { run.playing = false; run.playsUsed++; route(); });
    if (!ok) { run.playing = false; route(); return; }
    route();
  }
  function showScriptTimed(t, sec) {
    var plays = sec.plays || Infinity; // повтор не ограничен, пока идёт время раздела (ҚАЗТЕСТ: «мәтін бірнеше рет тыңдалады»; QRT: видео в пределах 10 минут)
    if (run.playsUsed >= plays || run.scriptVisible) return;
    run.scriptVisible = true; route();
    var secs = sec.script.readSeconds || 90, t0 = Date.now();
    var iv = setInterval(function () {
      var el = document.getElementById('script-left');
      var leftS = secs - (Date.now() - t0) / 1000;
      if (!el || !run || run.type !== 'listening') { clearInterval(iv); return; }
      if (leftS <= 0) { clearInterval(iv); run.scriptVisible = false; run.playsUsed++; route(); return; }
      el.textContent = T('скроется через') + ' ' + mmss(leftS);
    }, 500);
  }
  function submitQuiz(t, sec) {
    var missing = sec.questions.filter(function (q) { return run.answers[q.id] == null; }).length;
    var msg = document.getElementById('submit-msg');
    if (missing && !run.confirmSkip) { run.confirmSkip = true; if (msg) msg.textContent = T('Без ответа:') + ' ' + missing + '. ' + T('Нажмите ещё раз, чтобы зафиксировать как есть.'); return; }
    var score = 0; sec.questions.forEach(function (q) { if (run.answers[q.id] === q.answer) score++; });
    setSection(t.id, sec.type, { status: 'done', score: score, total: sec.questions.length, answers: run.answers, secondsUsed: Math.round(elapsed()), finishedAt: Date.now(), practice: !!ui.practice, startedAt: undefined });
    /* подробность по вопросам — ради неё всё и затевалось: видно, какой дистрактор выбирают и какой не выбирает никто */
    sendEvent('answers', { test: t.id, section: sec.type, level: t.level, exam: t.exam,
      q: sec.questions.map(function (q) {
        var a = run.answers[q.id];
        return { id: q.id, a: a == null ? -1 : (q._perm ? q._perm[a] : a), ok: a === q.answer ? 1 : 0 };   // a — индекс в исходных данных, не на экране
      }) });
    run.phase = 'review'; route();
  }

  /* --- письмо --- */
  function runWriting(t, sec, es) {
    if (sec.tasks) return runWritingTasks(t, sec, es);
    var saved = sp(t.id, 'writing') || {};
    if (run.promptId == null) run.promptId = saved.promptId || null;
    if (run.text == null) run.text = saved.text || '';
    if (run.checks == null) run.checks = saved.checks || [];
    if (run.sub === 'script' && run.promptId) run.sub = 'write'; // возврат к черновику: иначе автосохранение (sub === 'write') не работало
    var body = '';
    if (run.sub === 'script' && !run.promptId) {
      body = '<div class="block"><span class="setlabel">' + T('Выберите тему') + '</span><div class="prompt-pick">' + sec.prompts.map(function (p, i) { return '<label class="opt"><input type="radio" name="prompt" value="' + p.id + '"><span class="k">' + (i + 1) + '</span><span>' + esc(p.text) + '</span></label>'; }).join('') + '</div>' +
        '<p class="small muted mt">' + esc(LK(sec, 'targetNote') || '') + '</p><div class="actions"><button class="btn" data-act="pick-prompt">' + T('Начать писать') + '</button><span class="hint" id="submit-msg" role="status" aria-live="polite"></span></div></div>';
      run.afterRender = function () { if (!timer.iv) startTimer(sec.minutes * 60); else tick(); };
      return timerBar(sec) + body;
    }
    var prompt = sec.prompts.filter(function (p) { return p.id === run.promptId; })[0];
    if (run.sub !== 'check') {
      var acc = 0;
      var skel = sec.scaffold.map(function (s) { var from = acc; acc += s.minutes; return '<div class="skel" data-from="' + from * 60 + '" data-to="' + acc * 60 + '"><span class="tag">' + esc(LK(s, 'label')) + '<br>~' + s.minutes + ' ' + T('мин') + '</span><span><b>' + esc(LK(s, 'label')) + '.</b> <span class="hint hintx">' + esc(LK(s, 'hint')) + '</span></span></div>'; }).join('');
      body = '<div class="block"><span class="setlabel">' + T('Тема') + '</span><p style="font-size:16.5px;font-weight:600">' + esc(prompt.text) + '</p>' +
        '<div class="skeleton" id="skel">' + skel + '</div>' +
        '<div class="tags">' + sec.connectors.map(function (c) { return '<span class="tag-chip">' + esc(c) + '</span>'; }).join('') + '</div>' +
        (sec.sample ? '<details class="sample"><summary>' + T('Образец текста (структура, не копируйте)') + '</summary><div lang="kk" class="script">' + esc(sec.sample) + '</div></details>' : '') +
        '<textarea class="essay" id="essay" lang="kk" spellcheck="false" placeholder="Жазыңыз…">' + esc(run.text) + '</textarea><div class="wc" id="wc">' + wordCount(run.text) + ' ' + T('слов') + '</div>' +
        '<div class="actions"><button class="btn" data-act="finish-writing">' + T('Завершить и перейти к самопроверке') + '</button><span class="hint">' + T('Черновик сохраняется автоматически.') + '</span></div></div>';
      run.afterRender = function () {
        var startAt = run.secondsUsed || saved.secondsUsed || 0;
        if (!timer.iv) { startTimer(sec.minutes * 60, updateSkel); timer.start -= startAt * 1000; } else { timer.onTick = updateSkel; tick(); }
      };

/* ============================================================
   Курс по уровню (сейчас A1): темы → слова / грамматика / тексты / тест.
   Данные: KZ.courses.<LEVEL> (src/data/course/*.js, собираются из базы
   скриптом база/scripts/build_app_data.py). Подключается после app.js
   через KZ.registerRoute / KZ.util.
   ============================================================ */
(function () {
  'use strict';
  var T = KZ.T, LK = KZ.LK;
  var U = KZ.util, esc = U.esc;

  /* ---------- markdown-мини: таблицы, жирный, абзацы ---------- */
  function md(src) {
    var lines = String(src || '').split('\n'), out = [], i = 0;
    function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\\_/g, '_'); }
    while (i < lines.length) {
      var ln = lines[i];
      if (/^\s*\|/.test(ln)) {
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          var cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); });
          if (!cells.every(function (c) { return /^:?-{2,}:?$/.test(c) || c === ''; })) rows.push(cells);
          i++;
        }
        if (rows.length) out.push('<div class="tablewrap"><table class="gt">' + rows.map(function (r, ri) { return '<tr>' + r.map(function (c) { return '<' + (ri === 0 ? 'th' : 'td') + '>' + inline(c) + '</' + (ri === 0 ? 'th' : 'td') + '>'; }).join('') + '</tr>'; }).join('') + '</table></div>');
        continue;
      }
      if (ln.trim() === '') { i++; continue; }
      out.push('<p>' + inline(ln.trim()) + '</p>'); i++;
    }
    return out.join('');
  }

  /* ---------- прогресс курса ---------- */
  function cp(level, topicId) {
    var st = U.state();
    st.course = st.course || {}; st.course[level] = st.course[level] || {};
    if (!topicId) return st.course[level];
    return st.course[level][topicId] || (st.course[level][topicId] = { words: {}, quizBest: null, gramBest: null, textsDone: {}, testBest: null });
  }
  function topicProgress(level, tp) {
    var p = cp(level, tp.id);
    var known = 0; tp.words.forEach(function (w) { if (p.words[w.l] === 1) known++; });
    var parts = [];
    parts.push(tp.words.length ? known / tp.words.length : 1);
    if (tp.grammar.length) parts.push(p.gramBest == null ? 0 : p.gramBest);
    if (tp.texts.length) parts.push(Object.keys(p.textsDone).length / tp.texts.length);
    parts.push(p.testBest == null ? 0 : p.testBest);
    var pct = Math.round(100 * parts.reduce(function (a, b) { return a + b; }, 0) / parts.length);
    return { known: known, pct: pct, done: p.testBest != null && p.testBest >= 0.7 };
  }
  function courseProgress(course) {
    var tot = 0, known = 0, done = 0;
    course.topics.forEach(function (tp) { var r = topicProgress(course.level, tp); tot += tp.words.length; known += r.known; if (r.done) done++; });
    return { known: known, total: tot, done: done, topics: course.topics.length };
  }
  KZ.courseProgress = courseProgress;

  /* ---------- вьюхи ---------- */
  function viewCourse(course) {
    var pr = courseProgress(course);
    var rows = course.topics.map(function (tp) {
      var r = topicProgress(course.level, tp);
      return '<a class="level-row" href="#/course/' + course.level + '/' + tp.id + '"><span class="lvl">' + tp.order + '</span><span><div class="nm">' + esc(tp.kk) + ' <span class="muted small">· ' + esc(tp.ru) + '</span></div><div class="dsc">' + tp.words.length + ' ' + T('слов') + ' · ' + tp.grammar.length + ' ' + T('грам.') + ' ' + (tp.grammar.length === 1 ? T('тема') : T('темы')) + ' · ' + tp.texts.length + ' ' + KZ.plural(tp.texts.length, T('текст'), T('текста'), T('текстов')) + (tp.lessons.length ? ' · ' + T('уроки') + ' ' + tp.lessons.map(function (l) { return l.section + '.' + l.lesson; }).join(', ') : '') + '</div></span><span class="st"><span class="badge ' + (r.done ? 'ok' : r.pct ? 'warn' : 'muted') + '">' + (r.done ? T('пройдена') : r.pct + ' %') + '</span></span></a>';
    }).join('');
    return U.topbar([{ label: T('Хаб'), href: '#/' }, { label: course.title }], '<span class="badge level">' + course.level + '</span>') +
      '<div class="kicker">' + esc(course.kk) + ' · ' + esc(course.ru) + '</div><h1>' + esc(course.title) + ': ' + course.topics.length + ' ' + T('тем по официальной программе') + '</h1>' +
      '<p class="lede">' + T('Слова —') + ' ' + (course.stats.uniqueWords || pr.total) + (course.coverage ? ' (' + LK(course, 'coverage') + ')' : '') + ' ' + T('(выучено') + ' ' + pr.known + '), ' + T('грамматика —') + ' ' + course.stats.grammar + ' ' + T('тем, тексты —') + ' ' + course.stats.texts + (course.stats.textsWithQuestions != null ? ' (' + T('с вопросами') + ' ' + course.stats.textsWithQuestions + ')' : '') + '. ' + T('Каждая тема: карточки слов, правило с таблицей окончаний и заданиями, тексты с вопросами, итоговый тест. Тема считается пройденной при 70 % в итоговом тесте.') + '</p>' +
      '<div class="notice info"><b class="t">' + T('На чём основана методология') + '</b><p>' + esc(LK(course, 'note')) + '</p><ul class="srclist">' + course.sources.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>' +
      '<div class="levels">' + rows + '</div>' +
      (course.maqal && course.maqal.length ? '<section class="mt"><h2>' + T('Мақал-мәтелдер уровня') + '</h2><p class="sub">' + T('Из лексического минимума ҰТО. Пригодятся в письме и говорении: критерий «сөздік қор» прямо даёт балл за пословицы.') + '</p><div class="block"><ul class="prompt-list">' + course.maqal.map(function (m) { return '<li><span><b>' + esc(m.l) + '</b>' + (m.ru ? '<br><span class="muted small">' + esc(m.ru) + '</span>' : '') + '</span></li>'; }).join('') + '</ul></div></section>' : '');
  }

  function tabs(course, tp, cur) {
    var ts = [['words', 'Сөздер · ' + tp.words.length], ['grammar', T('Грамматика') + ' · ' + tp.grammar.length], ['texts', 'Мәтіндер · ' + tp.texts.length], ['test', T('Тест')]];
    return '<nav class="ctabs">' + ts.map(function (t) { return '<a class="' + (t[0] === cur ? 'on' : '') + '" href="#/course/' + course.level + '/' + tp.id + '/' + t[0] + '">' + t[1] + '</a>'; }).join('') + '</nav>';
  }
  function viewTopic(course, tp, tab) {

      '<div class="kicker">' + T('Тема') + ' ' + tp.order + ' · ' + esc(tp.ru) + '</div><h1>' + esc(tp.kk) + '</h1>' +
      (tp.lessons.length ? '<p class="lede">' + tp.lessons.map(function (l) { return '<b>' + l.section + '.' + l.lesson + ' ' + esc(l.title) + '</b>' + (l.phrases.length ? ' — «' + esc(l.phrases[0]) + '»' : '') + (l.grammar.length ? ' <span class="muted">(' + esc(l.grammar.join('; ')) + ')</span>' : ''); }).join('<br>') + '</p>' : '') +

  /* --- слова: карточки + квиз --- */
  function viewWords(course, tp) {

        '<div class="wf"><span class="lemma">' + esc(w.l) + '</span><span class="badge muted">' + esc(w.p) + '</span></div>' +
        (open ? '<div class="wb"><div class="tr">' + esc(w.ru) + (w.en ? ' <span class="muted">· ' + esc(w.en) + '</span>' : '') + '</div>' + (w.d ? '<div class="small muted">' + esc(w.d) + '</div>' : '') + (w.ex ? '<div class="ex">' + esc(w.ex) + '</div>' : '') +
          '<div class="row mt"><button class="btn small" data-act="c-know" data-w="' + esc(w.l) + '">' + T('Знаю') + '</button><button class="btn ghost small" data-act="c-learn" data-w="' + esc(w.l) + '">' + T('Ещё учу') + '</button><button class="btn ghost small" data-act="c-say" data-w="' + esc(w.l) + '" aria-label="' + T('Озвучить') + '">▶</button><span class="hint say-msg"></span></div></div>' : '') + '</div>';
    }).join('');
    return '<div class="block"><div class="row spread"><div class="row"><span class="badge ok">' + T('выучено') + ' ' + known + ' / ' + tp.words.length + '</span>' +
      ['all', 'new', 'known'].map(function (f) { return '<button class="cb' + (filter === f ? ' on' : '') + '" data-act="c-filter" data-f="' + f + '">' + ({ all: T('все'), new: T('учу'), known: T('знаю') })[f] + '</button>'; }).join('') + '</div>' +
      (tp.words.length >= 4 ? '<button class="btn" data-act="c-quiz">' + T('Проверить себя · 10 слов') + '</button>' : '') + '</div>' +
      '<p class="small muted mt">' + T('Нажмите на слово, чтобы открыть перевод, толкование и пример. Кнопка ▶ озвучивает слово, если в браузере есть казахский голос.') + (p.quizBest != null ? ' ' + T('Лучший результат квиза:') + ' ' + Math.round(p.quizBest * 100) + ' %.' : '') + '</p>' +
      '<div class="wgrid">' + (cards || '<p class="muted">' + T('В этом фильтре слов нет.') + '</p>') + '</div></div>';
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function makeVocabQuiz(tp, p, n) {
    var pool = tp.words.filter(function (w) { return w.ru; });
    var unknown = pool.filter(function (w) { return p.words[w.l] !== 1; });
    var pick = shuffle(unknown.length >= n ? unknown : pool).slice(0, n);
    return pick.map(function (w, i) {
      var dir = i % 2 === 0 ? 'kk-ru' : 'ru-kk';
      var used = {}; used[w.ru.toLowerCase()] = 1; used[w.l.toLowerCase()] = 1;
      function fresh(x) { var k1 = x.ru.toLowerCase(), k2 = x.l.toLowerCase(); if (used[k1] || used[k2]) return false; used[k1] = 1; used[k2] = 1; return true; }
      var ds = shuffle(pool.filter(function (x) { return x.l !== w.l && x.p === w.p; })).filter(fresh).slice(0, 3);
      if (ds.length < 3) ds = ds.concat(shuffle(pool.filter(function (x) { return x.l !== w.l && ds.indexOf(x) < 0; })).filter(fresh).slice(0, 3 - ds.length));
      var opts = shuffle([w].concat(ds));
      return { id: 'v' + i, text: dir === 'kk-ru' ? '«' + w.l + '» сөзінің аудармасын таңдаңыз.' : '«' + w.ru + '» сөзінің қазақша баламасын таңдаңыз.',
        options: opts.map(function (o) { return dir === 'kk-ru' ? o.ru : o.l; }), answer: opts.indexOf(w), explain: w.l + ' — ' + w.ru + (w.ex ? ' · ' + w.ex : ''), w: w.l };
    });
  }
  function viewQuiz(course, tp, run) {
    var qs = run.quiz;
    var locked = run.phase === 'review';
    var body = '<div class="block"><span class="setlabel">' + T('Квиз') + ' · ' + qs.length + ' ' + T('слов') + '</span>' + U.renderQuestions({ questions: qs }, run.answers, locked);
    if (!locked) body += '<div class="actions"><button class="btn" data-act="c-quiz-submit">' + T('Зафиксировать ответы') + '</button><button class="btn ghost" data-act="c-quiz-exit">' + T('Отмена') + '</button></div>';
    else { var sc = run.score; body += '<div class="score-card mt"><div class="score-big">' + sc + '<small>/' + qs.length + '</small></div><div><b>' + (sc / qs.length >= 0.8 ? T('Отлично.') : sc / qs.length >= 0.5 ? T('Половина есть, повторите слова из фильтра «учу».') : T('Вернитесь к карточкам.')) + '</b><div class="m">' + T('Верные ответы отмечены как «знаю», неверные — как «учу».') + '</div></div></div><div class="actions"><button class="btn" data-act="c-quiz">' + T('Ещё 10 слов') + '</button><button class="btn ghost" data-act="c-quiz-exit">' + T('К карточкам') + '</button></div>'; }
    return body + '</div>';
  }

  /* --- грамматика: правила + задания --- */
  function viewGrammar(course, tp) {
    var p = cp(course.level, tp.id), run = KZ.run();
    if (!tp.grammar.length) return '<div class="block"><p class="muted">' + T('В этой теме учебник не вводит новой грамматики.') + '</p></div>';
    var cards = tp.grammar.map(function (g, gi) {
      var open = run.openG == null ? gi === 0 : run.openG === gi;
      return '<div class="block"><div class="row spread" tabindex="0" role="button" data-act="c-gopen" data-g="' + gi + '" style="cursor:pointer"><h3 style="margin:0">' + esc(g.name) + '</h3><span class="badge muted">' + T('урок') + ' ' + esc(g.lesson) + ' · ' + esc(g.lesson_title || '') + '</span></div>' +
        (open ? '<div class="rule mt">' + md(g.rule) + '</div>' + (g.tasks.length ? '<p class="small muted mt">' + g.tasks.length + ' ' + T('заданий к этому правилу — в блоке ниже.') + '</p>' : '') : '') + '</div>';
    }).join('');
    var all = []; tp.grammar.forEach(function (g) { g.tasks.forEach(function (t, i) { all.push(Object.assign({ id: 'g' + all.length, text: t.stem, gname: g.name }, t)); }); });
    var quiz = '';
    if (all.length) {
      var locked = run.gphase === 'review';
      quiz = '<div class="block"><span class="setlabel">' + T('Задания') + ' · ' + all.length + '</span><p class="small muted">' + T('Задания составлены нашими специалистами по грамматической теме урока.') + (p.gramBest != null ? ' ' + T('Лучший результат:') + ' ' + Math.round(p.gramBest * 100) + ' %.' : '') + '</p>' +
        U.renderQuestions({ questions: all }, run.ganswers || {}, locked) +
        (locked ? '<div class="score-card mt"><div class="score-big">' + run.gscore + '<small>/' + all.length + '</small></div><div><b>' + T('Результат сохранён.') + '</b></div></div><div class="actions"><button class="btn ghost" data-act="c-gram-retry">' + T('Пройти заново') + '</button></div>' :
          '<div class="actions"><button class="btn" data-act="c-gram-submit">' + T('Зафиксировать ответы') + '</button><span class="hint" id="submit-msg"></span></div>') + '</div>';
    }
    return cards + quiz;
  }

  /* --- тексты --- */
  function viewTexts(course, tp) {
    var p = cp(course.level, tp.id), run = KZ.run();
    if (!tp.texts.length) return '<div class="block"><p class="muted">' + T('Текстов по этой теме в базе пока нет.') + '</p></div>';
    return tp.texts.map(function (t, ti) {
      var open = run.openT == null ? ti === 0 : run.openT === ti;
      var done = p.textsDone[t.id];
      var qs = t.questions.map(function (q, qi) { return Object.assign({ id: t.id + '-q' + qi, text: q.stem }, q); });
      var locked = run.tphase && run.tphase[t.id] === 'review';
      return '<div class="block"><div class="row spread" tabindex="0" role="button" data-act="c-topen" data-t="' + ti + '" style="cursor:pointer"><h3 style="margin:0">' + esc(t.title) + ' <span class="muted small">· ' + esc(t.genre) + ' · ' + t.words + ' ' + T('слов') + '</span></h3>' + (done ? '<span class="badge ok">' + T('прочитан') + '</span>' : '<span class="badge muted">' + (t.use.indexOf('listening') >= 0 ? T('аудио-скрипт') : T('чтение')) + '</span>') + '</div>' +
        (open ? '<div class="script mt">' + esc(t.text) + '</div><div class="row mt"><button class="btn ghost small" data-act="c-say-text" data-t="' + ti + '">▶ ' + T('Озвучить') + '</button><span class="hint" id="tts-msg"></span></div>' +
          (qs.length ? '<div class="mt"><span class="setlabel">' + T('Вопросы') + ' · ' + qs.length + '</span><p class="small muted">' + T('Вопросы составлены нашими специалистами по содержанию текста.') + '</p>' + U.renderQuestions({ questions: qs }, (run.tanswers || {})[t.id] || {}, locked) +
            (locked ? '<div class="actions"><span class="badge ok">' + T('верно') + ' ' + run.tscore[t.id] + ' / ' + qs.length + '</span></div>' : '<div class="actions"><button class="btn" data-act="c-text-submit" data-tid="' + esc(t.id) + '">' + T('Зафиксировать ответы') + '</button></div>') + '</div>' :
            (!done ? '<div class="actions"><button class="btn secondary small" data-act="c-text-done" data-tid="' + esc(t.id) + '">' + T('Прочитал(а)') + '</button></div>' : '')) : '') + '</div>';
    }).join('');
  }

  /* --- итоговый тест темы --- */
  function makeTopicTest(tp, p) {
    var qs = tp.words.length >= 4 ? makeVocabQuiz(tp, p, 7) : [];
    var g = []; tp.grammar.forEach(function (x) { x.tasks.forEach(function (t) { g.push(t); }); });
    shuffle(g).slice(0, 5).forEach(function (t, i) { qs.push(Object.assign({ id: 'tg' + i, text: t.stem }, t)); });
    var r = []; tp.texts.forEach(function (t) { t.questions.forEach(function (q) { r.push(Object.assign({}, q, { textId: t.id })); }); });
    shuffle(r).slice(0, 3).forEach(function (q, i) { var tx = tp.texts.filter(function (t) { return t.id === q.textId; })[0]; qs.push(Object.assign({ id: 'tr' + i, text: q.stem, ctx: tx ? tx.text : null }, q)); });
    return qs.map(function (q) { if (!q.text) q.text = q.stem; return q; });
  }
  function viewTest(course, tp) {
    var p = cp(course.level, tp.id), run = KZ.run();
    var avail = (tp.words.length >= 4 ? 1 : 0) + (tp.grammar.some(function (g) { return g.tasks.length; }) ? 1 : 0) + (tp.texts.some(function (t) { return t.questions.length; }) ? 1 : 0);
    if (!avail) return '<div class="block"><h3>' + T('Итоговый тест темы') + '</h3><p class="muted">' + T('Для этой темы пока нет ни слов, ни заданий — тест собрать не из чего.') + '</p></div>';
    if (!run.test) {
      return '<div class="block"><h3>' + T('Итоговый тест темы') + '</h3><p>' + T('До 15 вопросов: слова темы, окончания из грамматики урока и вопросы к текстам. Порог «тема пройдена» — 70 %.') + (p.testBest != null ? ' ' + T('Лучший результат:') + ' <b>' + Math.round(p.testBest * 100) + ' %</b>.' : '') + '</p><div class="actions"><button class="btn" data-act="c-test-start">' + T('Начать тест') + '</button></div></div>';
    }
    var locked = run.testPhase === 'review';
    var html = '';
    run.test.forEach(function (q, i) {
      if (q.ctx && (i === 0 || run.test[i - 1].ctx !== q.ctx)) html += '<div class="script small">' + esc(q.ctx) + '</div>';
      html += U.renderQuestions({ questions: [q] }, run.testAnswers || {}, locked, i + 1);
    });
    return '<div class="block"><span class="setlabel">' + T('Тест') + ' · ' + run.test.length + ' ' + T('вопросов') + '</span>' + html +
      (locked ? '<div class="score-card mt"><div class="score-big">' + run.testScore + '<small>/' + run.test.length + '</small></div><div><b>' + (run.testScore / run.test.length >= 0.7 ? T('Тема пройдена.') : T('Ниже 70 % — повторите слова и правило, затем ещё раз.')) + '</b></div></div><div class="actions"><button class="btn" data-act="c-test-start">' + T('Ещё раз') + '</button><a class="btn ghost" href="#/course/' + course.level + '">' + T('К списку тем') + '</a></div>' :
        '<div class="actions"><button class="btn" data-act="c-test-submit">' + T('Зафиксировать ответы') + '</button></div>') + '</div>';
  }

  /* ---------- маршрут и события ---------- */
  KZ.registerRoute(function (p) {
    if (p[0] !== 'course' || !KZ.courses || !KZ.courses[p[1]]) return null;
    var course = KZ.courses[p[1]];
    if (!p[2]) return viewCourse(course);
    var tp = course.topics.filter(function (t) { return t.id === p[2]; })[0];
    if (!tp) return viewCourse(course);
    var tab = ['words', 'grammar', 'texts', 'test'].indexOf(p[3]) >= 0 ? p[3] : 'words';
    var run = KZ.run(); if (run.key !== p[1] + '/' + p[2]) { KZ.resetRun({ key: p[1] + '/' + p[2] }); }
    return viewTopic(course, tp, tab);
  });
  // app.js уже отрисовал первый маршрут до регистрации курса — прямая ссылка #/course/... иначе открывает хаб
  if (/^#\/?course\//.test(location.hash)) KZ.route();

  function score(qs, answers) { var s = 0; qs.forEach(function (q) { if (answers[q.id] === q.answer) s++; }); return s; }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act^="c-"]'); if (!b) return;
    var act = b.getAttribute('data-act'), run = KZ.run();
    var parts = location.hash.replace(/^#\/?/, '').split('/'); var course = KZ.courses && KZ.courses[parts[1]]; if (!course) return;
    var tp = course.topics.filter(function (t) { return t.id === parts[2]; })[0]; if (!tp) return;
    var p = cp(course.level, tp.id);
    var stop = true;
    if (act === 'c-flip') { if (e.target.closest('button')) return; run.open = run.open === b.getAttribute('data-w') ? null : b.getAttribute('data-w'); }
    else if (act === 'c-know') { p.words[b.getAttribute('data-w')] = 1; U.save(); }
    else if (act === 'c-learn') { p.words[b.getAttribute('data-w')] = 0; U.save(); }
    else if (act === 'c-say') { if (!KZ.speak(b.getAttribute('data-w'))) { var mm = b.closest('.wb') && b.closest('.wb').querySelector('.say-msg'); if (mm) mm.textContent = T('Казахский голос не найден (есть в Microsoft Edge).'); } stop = false; }
    else if (act === 'c-say-text') { var t = tp.texts[+b.getAttribute('data-t')]; if (!KZ.speak(t.text)) { var m = document.getElementById('tts-msg'); if (m) m.textContent = T('Казахский голос не найден (есть в Microsoft Edge).'); } stop = false; }
    else if (act === 'c-filter') { run.filter = b.getAttribute('data-f'); }
    else if (act === 'c-quiz') { run.mode = 'quiz'; run.quiz = makeVocabQuiz(tp, p, 10); run.answers = {}; run.phase = 'run'; }
    else if (act === 'c-quiz-exit') { run.mode = null; }
    else if (act === 'c-quiz-submit') { run.score = score(run.quiz, run.answers); run.quiz.forEach(function (q) { p.words[q.w] = run.answers[q.id] === q.answer ? 1 : 0; }); p.quizBest = Math.max(p.quizBest || 0, run.score / run.quiz.length); U.save(); run.phase = 'review'; }
    else if (act === 'c-gopen') { run.openG = +b.getAttribute('data-g'); }
    else if (act === 'c-gram-submit') { var all = []; tp.grammar.forEach(function (g) { g.tasks.forEach(function (t) { all.push(Object.assign({ id: 'g' + all.length }, t)); }); }); run.gscore = score(all, run.ganswers || {}); p.gramBest = Math.max(p.gramBest || 0, run.gscore / all.length); U.save(); run.gphase = 'review'; }
    else if (act === 'c-gram-retry') { run.ganswers = {}; run.gphase = null; }
    else if (act === 'c-topen') { run.openT = +b.getAttribute('data-t'); }
    else if (act === 'c-text-done') { p.textsDone[b.getAttribute('data-tid')] = 1; U.save(); }
    else if (act === 'c-text-submit') { var tid = b.getAttribute('data-tid'), tx = tp.texts.filter(function (x) { return x.id === tid; })[0]; var qs = tx.questions.map(function (q, qi) { return Object.assign({ id: tid + '-q' + qi }, q); }); run.tphase = run.tphase || {}; run.tscore = run.tscore || {}; run.tscore[tid] = score(qs, (run.tanswers || {})[tid] || {}); run.tphase[tid] = 'review'; p.textsDone[tid] = 1; U.save(); }
    else if (act === 'c-test-start') { run.test = makeTopicTest(tp, p); run.testAnswers = {}; run.testPhase = 'run'; }
    else if (act === 'c-test-submit') { run.testScore = score(run.test, run.testAnswers); p.testBest = Math.max(p.testBest || 0, run.testScore / run.test.length); U.save(); run.testPhase = 'review'; }
    else stop = false;
    if (stop) { e.stopPropagation(); KZ.route(); }
  }, true);

  document.addEventListener('change', function (e) {
    var el = e.target; if (el.type !== 'radio' || !el.closest('.opts')) return;
    var parts = location.hash.replace(/^#\/?/, '').split('/'); if (parts[0] !== 'course') return;
    var run = KZ.run(), tab = parts[3] || 'words';
    if (run.mode === 'quiz') { run.answers = run.answers || {}; run.answers[el.name] = +el.value; }
    else if (tab === 'grammar') { run.ganswers = run.ganswers || {}; run.ganswers[el.name] = +el.value; }
    else if (tab === 'texts') { var tid = el.name.replace(/-q\d+$/, ''); run.tanswers = run.tanswers || {}; run.tanswers[tid] = run.tanswers[tid] || {}; run.tanswers[tid][el.name] = +el.value; }
    else if (tab === 'test') { run.testAnswers = run.testAnswers || {}; run.testAnswers[el.name] = +el.value; }
    var ul = el.closest('.opts'); Array.prototype.forEach.call(ul.querySelectorAll('.opt'), function (o) { o.classList.remove('selected'); }); el.closest('.opt').classList.add('selected');
    e.stopPropagation();
  }, true);
})();

</script>
</body></html>
