<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qazaq Trainer — мок-тесты ҚАЗТЕСТ и QazResmiTest</title><meta name="description" content="Бесплатные мок-тесты ҚАЗТЕСТ и QazResmiTest по уровням A1–C2: аудирование с озвучкой, чтение, письмо и говорение с таймером, как на экзамене. Без регистрации."><meta name="theme-color" content="#0e6e86"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="canonical" href="https://qazaqtrainer.com/"><meta property="og:type" content="website"><meta property="og:site_name" content="Qazaq Trainer"><meta property="og:locale" content="ru_RU"><meta property="og:title" content="Qazaq Trainer — мок-тесты ҚАЗТЕСТ и QazResmiTest"><meta property="og:description" content="Бесплатные мок-тесты ҚАЗТЕСТ и QazResmiTest по уровням A1–C2: аудирование с озвучкой, чтение, письмо и говорение с таймером, как на экзамене. Без регистрации."><meta property="og:url" content="https://qazaqtrainer.com/"><meta property="og:image" content="https://qazaqtrainer.com/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg:#faf8f3; --surface:#ffffff; --surface-raised:#f5f2ea;
  --ink:#1e2a30; --ink-muted:#5c6b70; --ink-faint:#66727a;
  --accent:#0e6e86; --accent-ink:#ffffff; --accent-soft:#e4f1f2;
  --gold:#8c6118; --gold-soft:#f6ecd8;
  --good:#377043; --good-soft:#e7f1e4;   /* 16.09.2026: #3f7d4a давал 4,27:1 на --good-soft, ниже нормы 4,5 */
  --bad:#b0463a; --bad-soft:#f8e6e3;
  --border:#e6e0d2; --border-strong:#d5cdb8;
  --shadow:0 1px 2px rgba(30,42,48,.06),0 8px 24px -12px rgba(30,42,48,.12);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171b; --surface:#182226; --surface-raised:#1d2a2f;
    --ink:#e9e4d8; --ink-muted:#9fadb2; --ink-faint:#8b979b;
    --accent:#5cc2dc; --accent-ink:#0a1417; --accent-soft:#1c343a;
    --gold:#e0b563; --gold-soft:#2b2416;
    --good:#7fbf8a; --good-soft:#1c2e1f;
    --bad:#e08a7e; --bad-soft:#3a1f1b;
    --border:#2a3438; --border-strong:#3a4448;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#10171b; --surface:#182226; --surface-raised:#1d2a2f;
  --ink:#e9e4d8; --ink-muted:#9fadb2; --ink-faint:#8b979b;
  --accent:#5cc2dc; --accent-ink:#0a1417; --accent-soft:#1c343a;
  --gold:#e0b563; --gold-soft:#2b2416;
  --good:#7fbf8a; --good-soft:#1c2e1f;
  --bad:#e08a7e; --bad-soft:#3a1f1b;
  --border:#2a3438; --border-strong:#3a4448;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
html{font-size:var(--fs,16px)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.6}
html[data-size=s]{--fs:14.5px}html[data-size=m]{--fs:16px}html[data-size=l]{--fs:18px}html[data-size=xl]{--fs:20.5px}
html[data-font=dys]{--sans:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;--serif:'Atkinson Hyperlegible',Verdana,sans-serif}
html[data-font=dys] body{letter-spacing:.02em;word-spacing:.06em;line-height:1.75}
html:not(.hints) .hintx{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;z-index:50}
.skip:focus{left:8px}
.uipanel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:-12px 0 22px;display:flex;flex-direction:column;gap:10px}
.uipanel .row{gap:12px}.uipanel .lbl{min-width:150px;font-size:0.8438rem;color:var(--ink-muted)}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
[tabindex="0"]:focus-visible,.wcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:840px;margin:0 auto;padding:28px 22px 110px}

/* ---- top bar / breadcrumb ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:0.75rem;color:var(--ink-faint)}
.crumbs a{color:var(--ink-muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.crumbs span.sep{color:var(--border-strong)}
.crumbs b{color:var(--ink);font-weight:600}

.kicker{font-family:var(--mono);font-size:0.7812rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.kicker::before{content:"";width:20px;height:1px;background:var(--accent)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.75rem,4.6vw,2.375rem);line-height:1.14;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:1.375rem;margin:0 0 6px;letter-spacing:-.005em}
h3{font-family:var(--serif);font-weight:600;font-size:1.0312rem;margin:0 0 10px}
.lede{color:var(--ink-muted);font-size:1.0312rem;max-width:64ch;margin:0 0 26px}
.lede b{color:var(--ink);font-weight:600}
.sub{color:var(--ink-muted);font-size:0.9375rem;margin:0 0 18px;max-width:64ch}
section{margin-bottom:44px}

/* ---- badges ---- */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:0.7188rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:6px;white-space:nowrap}
.badge.level{color:var(--accent);background:var(--accent-soft)}
.badge.exam{color:var(--ink-muted);background:var(--surface-raised);border:1px solid var(--border)}
.badge.ok{color:var(--good);background:var(--good-soft)}
.badge.warn{color:var(--gold);background:var(--gold-soft)}
.badge.muted{color:var(--ink-muted);background:var(--surface-raised)}   /* --ink-faint давал 4,41:1 */
.badge.bad{color:var(--bad);background:var(--bad-soft)}

/* ---- notices ---- */
.notice{background:var(--gold-soft);border:1px solid var(--border-strong);border-left:3px solid var(--gold);border-radius:8px;padding:14px 16px;font-size:0.9062rem;margin:0 0 22px}
.notice b.t{color:var(--gold);font-family:var(--mono);font-size:0.7188rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px}
.notice p{margin:0 0 6px}.notice p:last-child{margin:0}
.notice ul{margin:6px 0 0 18px;padding:0}
.notice.info{background:var(--accent-soft);border-left-color:var(--accent);border-color:var(--border)}
.notice.info b.t{color:var(--accent)}
.notice.good{background:var(--good-soft);border-left-color:var(--good);border-color:var(--border)}
.notice.good b.t{color:var(--good)}

/* ---- cards / blocks ---- */
.block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.block p{margin:0 0 10px;font-size:0.9375rem}
.block p:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

.exam-card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow);transition:border-color .15s}
.exam-card:hover{border-color:var(--accent)}
.exam-card .name{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:6px 0 4px}
.exam-card .tag{color:var(--ink-muted);font-size:0.9062rem;margin:0 0 14px}
.levels{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.level-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 16px;background:var(--surface);text-decoration:none;color:inherit}
.level-row:hover{background:var(--surface-raised)}
.level-row.draft{opacity:.7;cursor:default}
.level-row .lvl{font-family:var(--mono);font-weight:700;font-size:1rem;color:var(--accent);width:34px}
.level-row .nm{font-weight:600;font-size:0.9375rem}
.level-row .dsc{font-size:0.8125rem;color:var(--ink-muted)}
.level-row .st{text-align:right;font-family:var(--mono);font-size:0.75rem;color:var(--ink-faint)}

/* ---- stages list (exam structure) ---- */
.stages{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.stage{background:var(--surface);padding:15px 18px;display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:start;text-decoration:none;color:inherit}
a.stage:hover{background:var(--surface-raised)}
.stage.locked{opacity:.55}
.stage-num{font-family:var(--mono);font-weight:600;font-size:0.9375rem;color:var(--accent);padding-top:2px}
.stage-name{font-weight:600;font-size:0.9688rem;margin:0 0 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage-desc{color:var(--ink-muted);font-size:0.875rem;margin:0;max-width:54ch}
.stage-meta{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage-time{font-weight:600;font-size:0.9062rem}
.stage-tasks{font-size:0.75rem;color:var(--ink-faint);margin-top:2px}
.stage-score{font-size:0.7812rem;margin-top:4px;font-weight:600}
.stage-score.good{color:var(--good)}.stage-score.mid{color:var(--gold)}.stage-score.bad{color:var(--bad)}
.stages-total{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;background:var(--surface-raised);font-family:var(--mono);font-size:0.8125rem;color:var(--ink-muted)}
.stages-total b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- level ladder ---- */
.ladder{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.rung{flex:1;padding:14px 12px;border-right:1px solid var(--border);background:var(--surface)}
.rung:last-child{border-right:none}
.rung-level{font-family:var(--mono);font-weight:700;font-size:1rem;color:var(--accent)}
.rung-name{font-size:0.7812rem;color:var(--ink-muted);margin:2px 0 8px}
.rung-units{font-size:0.75rem;color:var(--ink-faint)}
.rung-focus{font-size:0.7812rem;color:var(--ink-muted);margin-top:8px;line-height:1.45}

/* ---- timer bar ---- */
.timerbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 0 12px;margin:-6px 0 22px}
.timerbar .lbl{font-family:var(--mono);font-size:0.75rem;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase}
.timerbar .clock{font-family:var(--mono);font-size:1.375rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.timerbar .clock.warn{color:var(--gold)}
.timerbar .clock.over{color:var(--bad)}
.timerbar .right{display:flex;align-items:center;gap:10px}

/* ---- script / passage ---- */
.script{font-family:var(--serif);font-style:italic;font-size:1rem;line-height:1.8;background:var(--surface-raised);border-left:3px solid var(--accent);padding:14px 18px;border-radius:0 8px 8px 0;margin-bottom:6px}
.script-note{font-size:0.7812rem;color:var(--ink-faint);margin:6px 0 16px}
.passage{font-size:0.9688rem;line-height:1.78;margin-bottom:6px}
.passage p{margin:0 0 12px}.passage p:last-child{margin:0}
.passage-title{font-family:var(--mono);font-size:0.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px}
.hidden-script{padding:18px;border:1px dashed var(--border-strong);border-radius:8px;text-align:center;color:var(--ink-faint);font-size:0.875rem;margin-bottom:18px}

/* ---- questions ---- */
.q{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--border)}
.q:first-child{border-top:none;padding-top:0;margin-top:0}
.q-text{font-weight:600;font-size:0.9688rem;margin:0 0 10px}
.q-text .qn{font-family:var(--mono);color:var(--accent);margin-right:8px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:0.9375rem;background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt input{margin:5px 0 0;accent-color:var(--accent)}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--ink-muted);min-width:16px}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.correct .k::after{content:" ✓";color:var(--good)}.opt.wrong .k::after{content:" ✗";color:var(--bad)}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--border)}
.opt.correct.locked:hover{border-color:var(--good)}
.opt.wrong.locked:hover{border-color:var(--bad)}
.explain{margin-top:8px;padding:9px 13px;background:var(--surface-raised);border-left:3px solid var(--good);border-radius:0 6px 6px 0;font-size:0.875rem;color:var(--ink)}
.explain.bad{border-left-color:var(--bad)}
.explain b{color:var(--good)}.explain.bad b{color:var(--bad)}
.verdict{font-family:var(--mono);font-size:0.75rem;font-weight:600;margin-left:8px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:600;font-size:0.9062rem;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;line-height:1.3}
.btn:hover{filter:brightness(1.06)}
.btn:active{filter:brightness(.94);transform:translateY(1px)}
.hint{font-size:0.8125rem;color:var(--ink-muted)}
.btn.secondary{background:var(--surface);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink-muted);border-color:var(--border)}
.btn.ghost:hover{color:var(--accent);border-color:var(--accent)}
.btn.small{font-size:0.8125rem;padding:8px 12px;min-height:34px}   /* палец на телефоне: не меньше 32 px */
.btn.gear{font-size:1.5rem;line-height:1;padding:2px 10px;color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--border)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.actions .hint{font-size:0.8125rem;color:var(--ink-faint)}

/* ---- result summary ---- */
.score-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow)}
.score-big{font-family:var(--serif);font-size:2.5rem;font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score-big small{font-size:1.125rem;color:var(--ink-faint)}
.score-card .m{font-size:0.875rem;color:var(--ink-muted)}

/* ---- writing ---- */
.prompt-list{list-style:none;margin:0;padding:0;counter-reset:p}
.prompt-list li{counter-increment:p;display:grid;grid-template-columns:26px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:0.9688rem}
.prompt-list li:first-child{border-top:none}
.prompt-list li::before{content:counter(p);font-family:var(--mono);font-weight:600;color:var(--accent)}
.prompt-pick{display:flex;flex-direction:column;gap:8px}
.prompt-pick .opt{align-items:center}
.skeleton{display:flex;flex-direction:column;gap:6px;margin:12px 0 16px}
.skel{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-size:0.875rem}
.skel .tag{font-family:var(--mono);font-size:0.75rem;font-weight:600;color:var(--ink-faint)}
.skel .hint{color:var(--ink-muted);font-size:0.8125rem}
.skel.now{border-color:var(--accent);background:var(--accent-soft)}
.skel.now .tag{color:var(--accent)}
.skel.past{opacity:.55}
textarea.essay{width:100%;min-height:260px;font-family:var(--sans);font-size:1rem;line-height:1.6;padding:14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
textarea.essay:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.sample{margin:12px 0}.sample summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:0.875rem}.sample .script{margin-top:8px}
.wc{font-family:var(--mono);font-size:0.7812rem;color:var(--ink-faint);margin-top:6px;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
.tag-chip{font-size:0.8438rem;padding:4px 10px;border-radius:20px;background:var(--surface-raised);border:1px solid var(--border);color:var(--ink)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;font-size:0.9062rem}
.checklist li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{margin-top:4px;accent-color:var(--good)}
.checklist li.static::before{content:"";width:15px;height:15px;margin-top:4px;flex-shrink:0;border:1.5px solid var(--border-strong);border-radius:4px}
.essay-view{white-space:pre-wrap;font-size:0.9688rem;line-height:1.7;background:var(--surface-raised);padding:14px 16px;border-radius:8px;border:1px solid var(--border)}

/* ---- speaking ---- */
.timebar{display:flex;height:24px;border-radius:6px;overflow:hidden;font-family:var(--mono);font-size:0.7188rem;font-weight:600;color:var(--accent-ink)}
.timebar span{display:flex;align-items:center;justify-content:center;background:var(--accent);opacity:.55}
.timebar span.now{opacity:1}
.timebar span + span{border-left:1px solid var(--bg)}
.timebar-labels{display:flex;font-size:0.75rem;color:var(--ink-faint);margin-top:5px}
.timebar-labels span{flex:1;text-align:center}
.sq{padding:14px 0;border-top:1px solid var(--border)}
.sq:first-child{border-top:none;padding-top:0}
.sq .qt{font-size:1rem;font-weight:600;margin:0 0 8px}
.sq .qt .qn{font-family:var(--mono);color:var(--accent);margin-right:8px}
.sq .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sq .clock{font-family:var(--mono);font-size:1.125rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:56px}
.sq .phase{font-family:var(--mono);font-size:0.75rem;color:var(--ink-muted)}
.sq.done .qt{color:var(--ink-muted)}

/* ---- misc ---- */
.setlabel{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:0.7188rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:6px;margin:0 0 12px}
.setlabel.extra{color:var(--gold);background:var(--gold-soft)}
.progress-dots{display:flex;gap:6px;align-items:center}
.progress-dots i{width:9px;height:9px;border-radius:50%;background:var(--border-strong);display:inline-block}
.progress-dots i.done{background:var(--good)}
.progress-dots i.part{background:var(--gold)}
.progress-dots i.cur{outline:2px solid var(--accent);outline-offset:2px}

        { id: 'r1', kind: 'mc', text: 'Мәтінге сәйкес ақпаратты табыңыз.', options: ['Ауыл оқушысы да астана ұстазының сабағын тыңдай алады.', 'Онлайн курсты бастағандардың жартысына жуығы аяқтайды.', 'Техникалық ақау үшін мұғалім жауап береді.', 'Сарапшылардың басым бөлігі тек дәстүрлі сабақты қолдайды.'], answer: 0, explain: 'Ключ: «шалғай ауылдағы оқушы да астанадағы үздік мұғалімнің сабағын тыңдай алады» (и ученик из дальнего аула может слушать урок лучшего учителя столицы). Курсы заканчивает лишь пятая часть, за сбои никто не отвечает, эксперты поддерживают смешанную модель.', explain_kk: 'Кілт: «шалғай ауылдағы оқушы да астанадағы үздік мұғалімнің сабағын тыңдай алады». Курсты тек бестен бірі аяқтайды, ақаулар үшін ешкім жауап бермейді, сарапшылар аралас модельді қолдайды.' },
        { id: 'r2', kind: 'mc', text: 'Мәтін бойынша, онлайн курсты аяқтамаудың басты себебі неде?', options: ['Курс материалы тым күрделі әрі көлемді.', 'Қадағалау болмаған кезде адам ісін кейінге шегереді.', 'Мұғалім тапсырманы электронды түрде уақытында тексермейді.', 'Оқушыда компьютер мен тыныш бөлме жоқ.'], answer: 1, explain: 'Ключ: «ешкім бақыламаған соң адам ісін кейінге қалдыра береді» (когда никто не контролирует, человек откладывает дело). Сложность материала не обсуждается; проверка заданий и домашние условия — другие проблемы, не названные причиной ухода с курса.', explain_kk: 'Кілт: «ешкім бақыламаған соң адам ісін кейінге қалдыра береді». Материалдың күрделілігі талқыланбайды; тапсырманы тексеру мен үй жағдайы — курсты тастап кетудің себебі ретінде аталмаған басқа мәселелер.' },
        { id: 'r3', kind: 'mc', text: 'Мәтінде жауабы жоқ сұрақты табыңыз.', options: ['Қашықтан оқыту қай жылдан бастап кең таралды?', 'Аралас үлгіде теория қалай беріледі?', 'Онлайн оқудың мұғалімге қандай жүктемесі бар?', 'Оқушылардың үй жағдайы қалай ерекшеленеді?'], answer: 0, explain: 'О времени распространения дистанционного обучения в тексте нет ни слова. Остальные вопросы имеют ответ: теория «онлайн беріледі», нагрузка учителя — запись уроков и электронная проверка, домашние условия — «бір оқушыда жеке компьютер... екіншісі бір телефонды інісімен бөліседі».', explain_kk: 'Қашықтан оқытудың қашан таралғаны туралы мәтінде бір ауыз сөз жоқ. Қалған сұрақтардың жауабы бар: теория «онлайн беріледі», мұғалімнің жүктемесі — сабақты жазып алу және электронды тексеру, үй жағдайы — «бір оқушыда жеке компьютер... екіншісі бір телефонды інісімен бөліседі».' },
        { id: 'r4', kind: 'mc', text: 'Мәтінге сәйкес емес ақпаратты табыңыз.', options: ['Студент жазбаны бірнеше рет қарап, қарқынын өзі белгілейді.', 'Экран арқылы пікірталас ұйымдастыру қиынға соғады.', 'Аралас үлгіде практика да онлайн өткізіледі.', 'Сабақты жазып, тапсырманы тексеру мұғалімнен көп уақыт алады.'], answer: 2, explain: 'Не соответствует: в смешанной модели «талқылау мен практика аудиторияда өтеді» (обсуждение и практика проходят в аудитории), онлайн даётся только теория. Регулирование темпа, трудность дискуссии через экран и нагрузка учителя — в тексте есть.', explain_kk: 'Сәйкес емес: аралас модельде «талқылау мен практика аудиторияда өтеді», онлайн тек теория беріледі. Қарқынды өзі реттеу, экран арқылы пікірталастың қиындығы және мұғалімнің жүктемесі мәтінде бар.' },
        { id: 'r5', kind: 'mc', text: 'Автордың қорытынды ұстанымын анықтаңыз.', options: ['Қашықтан оқыту дәстүрлі мектепті толық алмастырады.', 'Онлайн курстардың кемшілігі артықшылығынан басым.', 'Дәстүрлі сабақ онлайн оқытудан әлдеқайда сапалы.', 'Екі үлгінің күшті жақтарын біріктірген жол тиімді.'], answer: 3, explain: 'Вывод автора: смешанная модель «екі түрдің де күшті жақтарын біріктіреді» (объединяет сильные стороны обеих форм), «болашақтың мектебі тек қашықтан да, тек дәстүрлі де болмайды». Варианты про полную замену или превосходство одной формы противоречат этому.', explain_kk: 'Автордың қорытындысы: аралас модель «екі түрдің де күшті жақтарын біріктіреді», «болашақтың мектебі тек қашықтан да, тек дәстүрлі де болмайды». Толық алмастыру немесе бір түрдің артықшылығы туралы нұсқалар бұған қайшы.' },
        { id: 'g1', kind: 'mc', tag: 'лексика-грамматика', text: 'Мәтіндегі «сарапшылардың басым бөлігі» тіркесіндегі «басым» сөзіне мәндес сөзді көрсетіңіз.', options: ['белгілі', 'көп', 'жаңа', 'аз'], answer: 1, explain: '«Басым бөлігі» — большая часть, большинство: басым — преобладающий, то есть «көп» (многочисленный). «Белгілі» — известный, «жаңа» — новый, «аз» — малый (это антоним, а не синоним).', explain_kk: '«Басым бөлігі» — көп бөлігі, көпшілігі: басым — басымдық танытатын, яғни «көп». «Белгілі», «жаңа» — басқа мағыналы сөздер, ал «аз» — синоним емес, антоним.' },
        { id: 'g2', kind: 'mc', tag: 'лексика-грамматика', text: 'Мәтіндегі «кемшіліктері де айқын» тіркесіндегі «айқын» сөзіне қарсы мәндес сөзді көрсетіңіз.', options: ['көрнекі', 'күңгірт', 'белгілі', 'анық'], answer: 1, explain: '«Айқын» — ясный, очевидный; противоположное по смыслу — «күңгірт» (тусклый, неясный, смутный). «Көрнекі» (наглядный), «белгілі» (известный), «анық» (ясный) близки по смыслу слову «айқын», а не противоположны ему.', explain_kk: '«Айқын» — анық, көзге көрініп тұрған; мағынасы қарама-қарсы сөз — «күңгірт» (бұлыңғыр, анық емес). «Көрнекі», «белгілі», «анық» сөздері «айқын» сөзіне мағынасы жағынан жақын, қарама-қарсы емес.' },
        { id: 'g3', kind: 'mc', tag: 'лексика-грамматика', text: 'Сөйлемдегі бос орынға сәйкес тұлғаны қойыңыз: «Тапсырмасын уақытында … оқушы қашықтан оқуда тез артта қалады».', options: ['орындамай', 'орындамағандықтан', 'орындамайтын', 'орындамады'], answer: 2, explain: 'Перед существительным «оқушы» нужно определение — есімше (причастие) на -йтын: «орындамайтын оқушы» — ученик, который не выполняет. «Орындамай» — көсемше (деепричастие), «орындамағандықтан» — форма причины («из-за того, что не выполнил»), «орындамады» — өткен шақ (прошедшее время): перед существительным они стоять не могут.', explain_kk: '«Оқушы» зат есімінің алдында анықтауыш керек — -йтын жұрнақты есімше: «орындамайтын оқушы». «Орындамай» — көсемше, «орындамағандықтан» — себеп формасы, «орындамады» — өткен шақ: олар зат есімнің алдында анықтауыш бола алмайды.' },
        { id: 'g4', kind: 'mc', tag: 'лексика-грамматика', text: 'Сөйлемдегі бос орынға сәйкес тұлғаны қойыңыз: «Аралас үлгіде талқылау аудиторияда … ».', options: ['өткізіп', 'өткізіледі', 'өткізісті', 'өткіздіреді'], answer: 1, explain: 'Подлежащее «талқылау» само не совершает действие, поэтому нужен ырықсыз етіс (страдательный залог): «өткізіледі» — проводится. «Өткізіп» — көсемше (деепричастие, не может закончить предложение), «өткізісті» — ортақ етіс (взаимный залог), «өткіздіреді» — өзгелік етіс (понудительный залог).', explain_kk: '«Талқылау» бастауышы іс-әрекетті өзі жасамайды, сондықтан ырықсыз етіс керек: «өткізіледі». «Өткізіп» — көсемше (сөйлемді аяқтай алмайды), «өткізісті» — ортақ етіс, «өткіздіреді» — өзгелік етіс.' },
        { id: 'g5', kind: 'mc', tag: 'лексика-грамматика', text: 'Мәтіндегі «ісін кейінге қалдыру» тіркесіне мәндес тіркесті көрсетіңіз.', options: ['істі тастап кету', 'істі бөліп беру', 'істі тез аяқтау', 'істі кешіктіру'], answer: 3, explain: '«Ісін кейінге қалдыру» — откладывать дело на потом, то есть «істі кешіктіру» — задерживать, оттягивать дело. «Тастап кету» — бросить, «бөліп беру» — раздать другим, «тез аяқтау» — быстро закончить: это другие значения.', explain_kk: '«Ісін кейінге қалдыру» — істі кейінге ысыру, яғни «істі кешіктіру». «Тастап кету» — біржола қою, «бөліп беру» — басқаларға үлестіру, «тез аяқтау» — жылдам бітіру: бұлар басқа мағыналар.' }
      ] },

          'Біріншіден, жаңартылатын көздердің басты кемшілігі — тұрақсыздық: күн түнде батады, жел әрдайым соқпайды. Сондықтан желі энергияны сақтайтын қымбат жүйелерсіз немесе резервтік станцияларсыз жұмыс істей алмайды. Екіншіден, панельдер мен турбиналарды өндіру үшін сирек металдар қажет, ал олардың қоры бірнеше елде шоғырланған. Демек, мұнайға тәуелділіктің орнына жаңа тәуелділік туындауы мүмкін. Үшіншіден, ескірген панельдер мен турбина қалақтарын қайта өңдеу технологиясы әлі қымбат, сондықтан «таза» энергетиканың өз қалдық мәселесі бар.',
          'Қазақстан үшін мәселе екі есе өткір. Бір жағынан, елдің жел мен күн әлеуеті орасан зор, аумағының басым бөлігі — дала. Екінші жағынан, экономика мен бюджет әлі де көмір мен мұнайға сүйенеді, ал энергетика саласында ондаған мың адам жұмыс істейді. Көмір өңірлерін бір сәтте жабу әлеуметтік дағдарысқа әкелер еді: жұмыссыз қалған кенші жаңа станцияда өздігінен жұмыс таба алмайды, оған қайта оқу мен уақыт керек.',
          'Сарапшылар «әділ көшу» қағидасын ұсынады: жаңа станциялар салумен қатар, ескі салалардың қызметкерлерін қайта оқыту және өңірлерге инвестиция тарту. Бұл жол баяу, бірақ шынайы. Жасыл энергетика — мақсат емес, құрал; мақсат — адамдардың әл-ауқаты мен қауіпсіз орта. Осыны ұмытқан саясат экологиялық ұранға айналып, экономикалық мазмұнынан айырылады.'
        ], words: 215, note: '≈222 слова, C1: цифры, оговорки, две стороны, позиция экспертов, авторская сентенция в конце.' },
      questions: [
        { id: 'r1', kind: 'mc', text: 'Мәтін бойынша күн панельдерінің бағасы он жылда қалай өзгерген?', options: ['Бағасы тоқсан пайызға қымбаттаған', 'Бұрынғы бағасының оннан біріне түскен', 'Көмір станциясының бағасынан асып кеткен', 'Бұрынғы бағасының жартысына түскен'], answer: 1, explain: '«...шамамен тоқсан пайызға арзандады» — то есть стоит около десятой части прежней цены. Дешевле угля стали ветровые станции, а не панели.', explain_kk: '«...шамамен тоқсан пайызға арзандады» — яғни бұрынғы бағасының оннан бірі шамасында. Көмірден үнемді болғаны — жел станциялары.' },
        { id: 'r2', kind: 'mc', text: 'Автор жаңартылатын көздердің басты кемшілігін неде көреді?', options: ['Сирек металдарға тәуелділігінде', 'Энергияның үзіліссіз өндірілмеуінде', 'Ескі қалақтарды өңдеудің қымбаттығында', 'Көмір станциясынан қымбаттығында'], answer: 1, explain: '«...басты кемшілігі — тұрақсыздық: күн түнде батады, жел әрдайым соқпайды». Металлы и переработка названы вторым и третьим недостатком, не главным.', explain_kk: '«...басты кемшілігі — тұрақсыздық». Сирек металдар мен қайта өңдеу — екінші және үшінші кемшілік.' },
        { id: 'r3', kind: 'mc', text: 'Мәтін бойынша «жаңа тәуелділік» неден туындауы мүмкін?', options: ['Мұнай мен көмірге сүйенген бюджет құрылымынан', 'Қажетті металдардың аз елде шоғырлануынан', 'Энергияны сақтау жүйелерінің жоқтығынан', 'Шетелдік инвестициялардың шектен тыс көбеюінен'], answer: 1, explain: '«...сирек металдар қажет, ал олардың қоры бірнеше елде шоғырланған. Демек, мұнайға тәуелділіктің орнына жаңа тәуелділік туындауы мүмкін».', explain_kk: '«...сирек металдардың қоры бірнеше елде шоғырланған. Демек, ... жаңа тәуелділік туындауы мүмкін».' },
        { id: 'r4', kind: 'mc', text: 'Мәтінде жауабы жоқ сұрақты табыңыз.', options: ['Қазақстанның энергетика саласында қанша адам жұмыс істейді?', 'Күн панельдері неге арзандады?', 'Әділ көшу дегеніміз не?', 'Жасыл көшудің қандай кемшіліктері бар?'], answer: 1, explain: 'Факт удешевления есть, причина не названа; остальное раскрыто (тысячи работников названы примерно, «ондаған мың»).', explain_kk: 'Арзандау фактісі бар, себебі аталмаған; қалғаны ашылған (мыңдаған жұмысшы шамамен «ондаған мың» деп аталған).' },
        { id: 'r5', kind: 'mc', text: 'Мәтіннің негізгі ойын табыңыз.', options: ['Жасыл энергетика экономикаға тек зиян келтіреді', 'Көшу керек, бірақ әлеуметтік салдарын ескеріп', 'Қазақстан көмірден бірден бас тартуы тиіс', 'Жаңартылатын энергия көзі қай жерде де арзан'], answer: 1, explain: 'Автор не против перехода, но за «әділ көшу»: медленно, с переобучением людей. Резкое закрытие угольных регионов он называет путём к кризису.', explain_kk: 'Автор көшуге қарсы емес, бірақ «әділ көшуді» жақтайды: баяу, адамдарды қайта оқыта отырып.' },
        { id: 'g1', kind: 'mc', tag: 'лексика-грамматика', text: '«Орасан зор» тіркесіне мәндес сөзді (синонимді) табыңыз.', options: ['Өте үлкен', 'Тым шағын', 'Өте ұзақ', 'Аса терең'], answer: 0, explain: 'орасан зор — огромный. «Өте ұзақ» — очень долгий/длинный: ловушка для того, кто слышит только «очень».', explain_kk: 'орасан зор — өте үлкен. «Өте ұзақ» — көлемді емес, ұзақтықты білдіреді.' },
        { id: 'g2', kind: 'mc', tag: 'лексика-грамматика', text: '«Үнемді» сөзіне қарсы мәндес сөзді (антонимді) көрсетіңіз.', options: ['Ысырапшыл', 'Қанағатшыл', 'Пайдасыз', 'Табысты'], answer: 0, explain: 'үнемді — экономный; ысырапшыл — расточительный. Қанағатшыл (довольствующийся малым) близок по смыслу, а не противоположен.', explain_kk: 'үнемді — ысырапшыл сөзінің антонимі. Қанағатшыл мағынасы жағынан жақын, қарсы емес.' },
        { id: 'g3', kind: 'mc', tag: 'лексика-грамматика', text: 'Көмір өңірлерін бір сәтте жабу дағдарысқа әкел… еді. Дұрыс тұлғаны таңдаңыз.', options: ['-ер', '-ді', '-ген', '-іп'], answer: 0, explain: 'әкелер еді — сослагательное: «привело бы».', explain_kk: 'әкелер еді — шартты мән: болжалды нәтиже.' },
        { id: 'g4', kind: 'mc', tag: 'лексика-грамматика', text: '«Ұранға айналу» тіркесінің мәтіндік мағынасын анықтаңыз.', options: ['Мазмұнсыз сөзге айналу', 'Халық қолдауына ие болу', 'Заңды түрде бекітілу', 'Жеңіске жетуге бастау'], answer: 0, explain: 'Политика «превращается в лозунг и теряет экономическое содержание» — то есть в пустую декларацию.', explain_kk: 'Саясат «ұранға айналып, экономикалық мазмұнынан айырылады» — яғни бос сөзге айналады.' },
        { id: 'g5', kind: 'mc', tag: 'лексика-грамматика', text: '«Жаңартылатын энергия көздері» тіркесіндегі «жаңартылатын» қандай тұлға?', options: ['Ырықсыз етіс + есімше', 'Өзгелік етіс + көсемше', 'Ортақ етіс + есімше', 'Тұйық етістік'], answer: 0, explain: 'жаңарт-ыл-атын: страдательный залог -ыл + причастие -атын.', explain_kk: 'жаңарт-ыл-атын: ырықсыз етіс -ыл + есімше -атын.' }
      ] },

        { id: 'x3', text: '«Үлес қосу» тіркесінің мағынасын анықтаңыз.', options: ['Ортақ іске өз көмегін беру', 'Ортақ қаржыдан үлес сұрау', 'Табысты өзара бөліп алу'], answer: 0, explain: 'үлес қосу — вносить вклад. «Үлес» также значит «доля», отсюда ловушки про деньги и дележ.', explain_kk: 'үлес қосу — ортақ іске өз үлесін енгізу. «Үлес» — бөлік деген мағына да береді, тұзақ содан.' },
        { id: 'x4', text: 'Ұйымдар грант… тәуелді. Дұрыс жалғауды таңдаңыз.', options: ['-қа', '-тан', '-та'], answer: 0, explain: 'тәуелді — управляет направительным падежом: грантқа тәуелді.', explain_kk: 'тәуелді — барыс септікті меңгереді: грантқа тәуелді.' },
        { id: 'x5', text: 'Жиналыс сағат онда … (өткізу, ырықсыз етіс, келер шақ).', options: ['өткізіледі', 'өткізеді', 'өткізіседі'], answer: 0, explain: 'өткізіледі — страдательный залог: собрание будет проведено.', explain_kk: 'өткізіледі — ырықсыз етіс: жиналыс өткізілетін болады.' },
        { id: 'x6', text: '«Жетіспеу» сөзіне мәндес сөзді (синонимді) табыңыз.', options: ['жетпеу', 'артып қалу', 'жинау'], answer: 0, explain: 'жетіспеу — жетпеу (не хватать).', explain_kk: 'жетіспеу — жетпеу.' },
        { id: 'x7', text: 'Ресми хатқа сай нұсқаны таңдаңыз.', options: ['Өтінішіңізді қарап шықтық, бірақ, кешіріңіз, ештеңе болмайды.', 'Өтінішіңіз қаралып, теріс шешім қабылданғанын хабарлаймыз.', 'Өтінішіңізге жауап: жоқ, көмектесе алмаймыз, басқа жерге барыңыз.'], answer: 1, explain: 'Официальный стиль: страдательный залог (қаралып, қабылданғанын), нейтральная лексика, без разговорных вставок («кешіріңіз, ештеңе болмайды»).', explain_kk: 'Ресми стиль: ырықсыз етіс, бейтарап лексика, ауызекі қыстырмаларсыз.' },
        { id: 'x8', text: 'Егер қаржы бол…, жоба жалғасар еді. Дұрыс жалғауды таңдаңыз (шартты рай).', options: ['-са', '-ған', '-ып'], answer: 0, explain: 'болса — условное наклонение -са/-се.', explain_kk: 'болса — шартты рай -са/-се.' },
        { id: 'x9', text: '«Тетік» сөзінің мәтіндік мағынасын көрсетіңіз (тетігін жасау).', options: ['механизм, жүзеге асыру жолы', 'есікті ашатын кілт, құлып', 'арнайы бөлінетін қаржы, қор'], answer: 0, explain: 'тетік — механизм, рычаг; «тетігін жасау» — создать механизм. Буквальный «ключ» — ловушка.', explain_kk: 'тетік — механизм; «тетігін жасау» — жүзеге асыру жолын жасау.' },
        { id: 'x10', text: 'Ол қызметкер… еріктілік қызметін құптайды. Дұрыс жалғауды таңдаңыз (ілік септік, ІІІ жақ).', options: ['-інің', '-ның', '-інде'], answer: 0, explain: 'қызметкерінің: притяжательный аффикс 3-го лица -і + родительный -нің (мягкий ряд). -ның — твёрдый ряд, -інде — местный падеж.', explain_kk: 'қызметкерінің: тәуелдік -і + ілік -нің (жіңішке). -ның — жуан, -інде — жатыс септік.' },
      ] },
    { type: 'reading', minutes: 15,
      intro: 'Публицистический текст о миграции молодёжи. Вопросы на интерпретацию, причины и позицию автора.', intro_kk: 'Жастардың көші-қоны туралы публицистикалық мәтін. Түсіндіруге, себептерге және автор ұстанымына қатысты сұрақтар.',
      passage: { title: 'Жастардың қалаға көшуі: себептері мен салдары',
        paragraphs: [
          'Соңғы онжылдықта ауыл жастарының ірі қалаларға көшуі тұрақты үрдіске айналды. Статистика бойынша, жыл сайын ауылдан қалаға көшетіндердің жартысынан көбі — 18–29 жас аралығындағы азаматтар. Бұл құбылыстың себептері әртүрлі, бірақ негізгісі — білім мен жұмыс.',
          'Ауыл мектебін бітірген түлек университетке қалаға кетеді, ал оқуын аяқтаған соң, көбіне, сол қалада қалады. Себебі ауылда мамандығы бойынша жұмыс табу қиын, ал табылса да, жалақысы төмен. Сонымен қатар жастарды қаланың инфрақұрылымы — театр, спорт кешендері, жылдам интернет — тартады.',
          'Салдары екіжақты. Бір жағынан, қалалар жас мамандармен толығып, экономика дамиды. Екінші жағынан, ауылдар қартайып, мектептер жабылады, жер өңдейтін адам азаяды. Кейбір өңірлерде тіпті мектептегі оқушы саны бес жылда екі есе қысқарған. Дәрігер мен мұғалім жетіспейтін ауылда қалған тұрғындар да көшу туралы ойлана бастайды, сөйтіп үдеріс өзін-өзі күшейтеді.',
          'Мемлекет бұл мәселені «Дипломмен ауылға» сияқты бағдарламалармен шешуге тырысады: ауылға барған жас маманға тұрғын үй және біржолғы жәрдемақы беріледі. Алайда сарапшылардың пікірінше, ақшаның өзі жеткіліксіз. Жастарды ауылда ұстап қалу үшін жол, интернет және медицина қаладағыдан кем болмауы керек. Мысалы, жылдам интернет пен жақсы жол тартылған бір ауылда соңғы үш жылда жастардың кетуі тоқтап, керісінше, қаладан қашықтан жұмыс істейтін бірнеше отбасы көшіп келген.',
          'Демек, мәселе жастардың таңдауында емес, ауыл мен қала арасындағы мүмкіндіктер айырмашылығында. Жастар кетпейтін ауыл — үгітпен емес, жолмен, интернетпен және жұмыспен жасалады. Айырмашылық азайған сайын, көш те баяулайды.'
        ], words: 205, note: '≈178 слов, B2: причины и следствия, чужое мнение (сарапшылар), вывод автора, статистика.' },
      questions: [
        { id: 'r1', kind: 'mc', text: 'Ауылдан қалаға көшетіндердің көпшілігі кімдер?', options: ['Қашықтан жұмыс істейтін отбасылар', 'Жиырма тоғызға дейінгі жастар', 'Мамандығы бар жас дәрігерлер'], answer: 1, explain: '«...жартысынан көбі — 18–29 жас аралығындағы азаматтар». Семьи с удалённой работой, наоборот, переезжают в село.', explain_kk: '«...жартысынан көбі — 18–29 жастағы азаматтар». Қашықтан жұмыс істейтін отбасылар, керісінше, ауылға көшіп келген.' },
        { id: 'r2', kind: 'mc', text: 'Түлек оқуын бітірген соң неге қалада қалады?', options: ['Ауылда мамандығына сай, табысты жұмыс аз', 'Қалада тұрғын үй ауылдағыдан арзанырақ', 'Ауылдағы мектептердің жабылып жатқаны'], answer: 0, explain: '«Себебі ауылда мамандығы бойынша жұмыс табу қиын, ал табылса да, жалақысы төмен». О цене жилья в тексте речи нет; закрытие школ — следствие оттока, а не его причина.', explain_kk: '«Себебі ауылда мамандығы бойынша жұмыс табу қиын, ал табылса да, жалақысы төмен». Мектептің жабылуы — көштің салдары.' },
        { id: 'r3', kind: 'tf', text: 'Мәтін бойынша жастардың көшуі қалалардың экономикасына пайда әкеледі.', answer: 0, explain: 'Дұрыс: «Бір жағынан, қалалар жас мамандармен толығып, экономика дамиды».', explain_kk: 'Дұрыс: «қалалар жас мамандармен толығып, экономика дамиды».' },
        { id: 'r4', kind: 'mc', text: 'Кейбір өңірлерде бес жылда не болды?', options: ['Мектептердің саны екі есеге жуық көбейді', 'Оқушылар саны жартысына дейін азайды', 'Ауылдағы жалақы екі есеге дейін төмендеді'], answer: 1, explain: '«...мектептегі оқушы саны бес жылда екі есе қысқарған» — то есть уменьшилось вдвое.', explain_kk: '«...оқушы саны бес жылда екі есе қысқарған» — яғни жартысына дейін азайған.' },
        { id: 'r5', kind: 'mc', text: '«Дипломмен ауылға» бағдарламасы не береді?', options: ['Қаладан тегін жоғары білім алу', 'Баспана мен бір реттік көмек ақы', 'Ауылдағы жалақыны екі есе көбейту'], answer: 1, explain: '«...тұрғын үй және біржолғы жәрдемақы беріледі».', explain_kk: '«...тұрғын үй және біржолғы жәрдемақы беріледі».' },
        { id: 'r6', kind: 'mc', text: 'Сарапшылардың пікірінше, жастарды ауылда ұстау үшін не керек?', options: ['Жас маманға берілетін ақшаны көбейту', 'Ауылдағы тұрмыс қаладан кем болмауы', 'Жастардың қалаға көшуін заңмен шектеу'], answer: 1, explain: '«...ақшаның өзі жеткіліксіз. Жастарды ауылда ұстап қалу үшін жол, интернет және медицина қаладағыдан кем болмауы керек».', explain_kk: '«...ақшаның өзі жеткіліксіз. ... жол, интернет және медицина қаладағыдан кем болмауы керек».' },
        { id: 'r7', kind: 'tf', text: 'Автор мәселенің түп-төркінін жастардың өз таңдауынан көреді.', answer: 1, explain: 'Бұрыс: «мәселе жастардың таңдауында емес, ауыл мен қала арасындағы мүмкіндіктер айырмашылығында».', explain_kk: 'Бұрыс: «мәселе жастардың таңдауында емес, ... мүмкіндіктер айырмашылығында».' },
        { id: 'r8', kind: 'mc', text: '«Ауылдар қартайып» деген тіркес нені білдіреді?', options: ['Ауылдағы үй мен жолдар тозып, ескіреді', 'Ауылда жастар азайып, қарттар көбейеді', 'Ауылдың тарихы тым ұзақ әрі көне екені'], answer: 1, explain: 'Метафора: село «стареет», потому что молодёжь уезжает и доля пожилых растёт. Буквальное «старые дома» — ловушка.', explain_kk: 'Метафора: жастар кеткендіктен ауылда қарттардың үлесі өседі.' },
        { id: 'r9', kind: 'mc', text: 'Мәтіннің негізгі ойын табыңыз.', options: ['Жастар ауылдан кетпеуі керек, бұл қате таңдау', 'Көшті ауыл мен қала айырмашылығы тудырады', 'Мемлекеттік бағдарламалар мәселені шешті'], answer: 1, explain: 'Итог текста: «мәселе ... ауыл мен қала арасындағы мүмкіндіктер айырмашылығында»; сократится разница — замедлится отток.', explain_kk: '«...мәселе ... мүмкіндіктер айырмашылығында. Айырмашылық азайған сайын, көш те баяулайды».' },
        { id: 'r10', kind: 'tf', text: 'Сарапшылардың пікірінше, ауылға баратын маманға ақша берудің өзі жеткіліксіз.', answer: 0, explain: 'Дұрыс: «Алайда сарапшылардың пікірінше, ақшаның өзі жеткіліксіз».', explain_kk: 'Дұрыс: «сарапшылардың пікірінше, ақшаның өзі жеткіліксіз».' }

      script: { title: 'Мәдени мұраны цифрландыру: мүмкіндік пе, қауіп пе?',
        text: 'Құрметті қатысушылар! Соңғы бес жылда ұлттық мұрағат қорының төрттен бірі цифрланды: қолжазбалар, фотосуреттер, дыбыс жазбалары. Бұл сөзсіз жетістік, өйткені бұрын зерттеуші үшін бір құжатқа қол жеткізу апталар алатын, енді секундтар алады. Дегенмен мен бүгін цифрландырудың екі қаупіне тоқталғым келеді. Біріншісі — «цифрланды» мен «сақталды» ұғымдарын шатастыру. Сканерленген сурет түпнұсқаны алмастырмайды: файл форматы ескіреді, сервер істен шығады, ал қағаз дұрыс жағдайда ғасырлар бойы сақталады. Цифрлық көшірме — қосымша, негіз емес. Мысал қажет пе? Бір облыстық мұрағат бес жыл бұрын сканерленген жиырма мың бетті жоғалтты: сервер істен шықты, ал қосалқы көшірме ешкімнің міндетінде болмаған. Қағаз түпнұсқалар аман, сондықтан жұмысты қайталауға болады, бірақ бес жыл бос кетті. Екіншісі — қолжетімділік иллюзиясы. Мұрағаттың төрттен бірі цифрланды дедік, бірақ соның жартысынан азы ғана сипаттамамен, яғни іздеуге жарамды метадеректермен жабдықталған. Сипаттамасыз миллион файл — бұл кітапхана емес, қойма. Зерттеуші оған кіреді де, іздеу жолағына сұрақ жазады, ал жүйе үндемейді, өйткені файлдардың аты — тек сандар. Сондықтан ұсынысым қарапайым: бюджеттің басым бөлігін сканерлеуге емес, ғылыми сипаттауға бағыттау. Бұл көзге көрінбейтін, есеп беруге ыңғайсыз жұмыс, бірақ мұраны нақты қолжетімді ететін — дәл осы. Цифрландыру — тарихты сақтаудың жолы емес, оны оқуға шақырудың жолы. Назарларыңызға рақмет.',

      questions: [

        { id: 'l3', text: 'Цифрланған қордың қанша бөлігі метадеректермен жабдықталған?', options: ['Төрттен бір бөлігі', 'Жартысына жетпейді', 'Жиырма мың бетке жуығы'], answer: 1, explain: '«...соның жартысынан азы ғана сипаттамамен... жабдықталған». Четверть — доля оцифрованного архива, двадцать тысяч страниц — потерянные при сбое.', explain_kk: '«...соның жартысынан азы ғана сипаттамамен жабдықталған». Төрттен бірі — цифрланған қордың үлесі, жиырма мың бет — жоғалған беттер.' },

      ] },

      questions: [
        { id: 'x1', text: 'Паронимдер: Комиссия құжаттарды … (тексеру ісін атқарды).', options: ['сараптады', 'сарапталды', 'сараптатты'], answer: 0, explain: 'сараптау — провести экспертизу (субъект действует сам); сарапталу — быть подвергнутым; сараптату — заставить.', explain_kk: 'сараптау — субъектінің өзі сараптауы; сарапталу — ырықсыз етіс; сараптату — өзгелік етіс.' },
        { id: 'x2', text: '«Көзге көрінбейтін жұмыс» тіркесінің мағынасын анықтаңыз.', options: ['Нәтижесі бірден байқала қоймайтын еңбек', 'Ешкімге білдірмей істелетін құпия іс', 'Түнгі уақытта ғана атқарылатын жұмыс'], answer: 0, explain: 'Незаметный, недооценённый труд: результат не бросается в глаза и «есеп беруге ыңғайсыз». Буквальное «тайная работа» — ловушка.', explain_kk: 'Нәтижесі бірден байқалмайтын, бағаланбайтын еңбек. «Құпия іс» — тура мағынасына сүйенгенге тұзақ.' },
        { id: 'x3', text: 'Дұрыс жазылған нұсқасын таңдаңыз.', options: ['метадеректер', 'мета-деректер', 'мета деректер'], answer: 0, explain: 'Приставка мета- пишется слитно.', explain_kk: 'мета- префиксі бірге жазылады.' },
        { id: 'x4', text: '«Түпнұсқа» сөзіне қарсы мәндес сөзді (антонимді) табыңыз.', options: ['көшірме', 'шығарма', 'қолжазба'], answer: 0, explain: 'түпнұсқа — оригинал, көшірме — копия. Қолжазба (рукопись) сама может быть оригиналом.', explain_kk: 'түпнұсқа — көшірменің антонимі. Қолжазба өзі де түпнұсқа бола алады.' },
        { id: 'x5', text: 'Ресми есепке сай нұсқаны таңдаңыз.', options: ['Ақша уақытында бітіп қалғандықтан, біз бұл жобаны аяқтай алмадық, амал жоқ.', 'Қаржыландырудың жеткіліксіздігіне байланысты жоба толық көлемде іске асырылмады.', 'Жобаға бөлінген ақша жетпей қалды, сондықтан жартысын ғана істедік.'], answer: 1, explain: 'Официальный стиль: отглагольные существительные (қаржыландыру, жеткіліксіздік), страдательный залог, без разговорного «амал жоқ» и личного «біз».', explain_kk: 'Ресми стиль: қимыл есімдері, ырықсыз етіс, «амал жоқ», «біз» сияқты ауызекі элементтерсіз.' },
        { id: 'x6', text: '«Ат үсті қарау» фразеологизмінің мағынасын көрсетіңіз.', options: ['Үстірт, асығыс қарау', 'Мұқият, асықпай зерттеу', 'Жоғарыдан менсінбей қарау'], answer: 0, explain: 'Поверхностно, наспех (буквально «смотреть с коня»). «Свысока» — буквальное прочтение, ловушка.', explain_kk: 'Үстірт, асығыс қарау. «Жоғарыдан менсінбей» — тура мағынаға сүйенгенге тұзақ.' },
        { id: 'x7', text: '«Иллюзия» терминінің қазақша баламасын таңдаңыз.', options: ['елес, жалған әсер', 'нақты дәлел, айғақ', 'шығармашыл қиял'], answer: 0, explain: 'Иллюзия — обманчивое впечатление; «қолжетімділік иллюзиясы» — видимость доступности.', explain_kk: 'Иллюзия — алдамшы әсер; «қолжетімділік иллюзиясы» — қолжетімді болып көрінуі.' },

        { id: 'x9', text: 'Дұрыс жазылған нұсқасын таңдаңыз.', options: ['ғылыми-техникалық', 'ғылыми техникалық', 'ғылымитехникалық'], answer: 0, explain: 'Парное прилагательное — через дефис.', explain_kk: 'Қос сын есім — дефис арқылы.' },
        { id: 'x10', text: '«Басым бөлігі» тіркесінің синонимін табыңыз.', options: ['көпшілігі', 'аз бөлігі', 'жартысы'], answer: 0, explain: 'басым бөлігі — большая часть.', explain_kk: 'басым бөлігі — көп бөлігі.' }

    { type: 'reading', minutes: 15,
      intro: 'Публицистическое эссе с иронией. Следите за тем, с чем автор спорит, какие оговорки делает и где его собственная позиция.', intro_kk: 'Ирониясы бар публицистикалық эссе. Автордың немен таласатынын, қандай ескертпелер жасайтынын және өз ұстанымы қайда екенін қадағалаңыз.',
      passage: { title: 'Жылдамдықтың құны',
        paragraphs: [
          'Бұрын жаңалық таңертең газетпен келетін, енді ол секунд сайын телефонға түседі. Редакторлар мұны «оқырманға деген құрмет» дейді: адам ақпаратты кешікпей алуға құқылы. Бұл дәлел әдемі, бірақ оның астарында басқа есеп жатыр — кім бірінші жарияласа, соған көбірек басады.',
          'Жылдамдықтың бағасы бар, ал оны төлейтін — оқырман. Сарапшылар соңғы жылдары ірі порталдардың әр төртінші жаңалығы кейін түзетілетінін немесе жойылатынын анықтаған. Түзету, әрине, шығады — бірақ оны алғашқы хабардың оннан бірі де оқымайды. Сөйтіп, қате мен шындық бір мезгілде өмір сүреді, әрі қатенің аудиториясы әрқашан үлкен. Өткен көктемде бір портал ірі кәсіпорынның жабылатыны туралы хабар таратты; екі сағаттан кейін кәсіпорын оны жоққа шығарды, порталдың түзетуі шықты. Бірақ сол екі сағатта хабар мыңдаған рет бөлісілді, ал түзету — жүз шақты рет. Кәсіпорын аман, беделі емес.',
          'Ең қызығы, оқырманның өзі баяу жаңалықты қаламайды. Сауалнамада респонденттердің басым көпшілігі «тексерілген ақпаратты» талап етеді, бірақ дәл солар тексерілмеген хабарды бірінші болып бөліседі. Біз шындықты бағалаймыз, ал жылдамдықты тұтынамыз. Бұл екіжүзділік емес, адам табиғаты: жаңалық — ақпарат емес, эмоция. Эмоция шындықты күтпейді, ол бірінші келгенге жабысады. Редакциялар мұны бізден жақсы біледі, сондықтан тақырыптарда етістіктің орнына леп белгісі тұрады.',
          'Кейбір басылымдар «баяу журналистика» ұранымен шықты: аптасына бір ұзақ мәтін, әр дерек екі дереккөзбен расталған. Идея тамаша, оқырманы аз. Өйткені баяу оқу — дағды, ал дағды жарнамамен емес, әдетпен қалыптасады. Осы жерде мен редакторлармен емес, мектеппен дауласқым келеді: біз балаларды жылдам іздеуге үйретеміз, ал күтуге үйретпейміз. Сабақта «дереккөзді тап» деген тапсырма бар, ал «бір күн күтіп, ертең қайта оқы» деген тапсырма жоқ. Сөйтіп, мектеп бітірген адам ақпаратты табуды біледі, бірақ оны пісуге қалдыруды білмейді.',
          'Маған қарсы шығатындар айтады: жаңалық кешіксе, оның орнын өсек басады. Дұрыс. Бірақ өсек те бірінші болғысы келетін редакциялардың өнімі: олар алдымен өсекті жариялап, кейін оны «тексерілмеген ақпарат» деп атайды. Күте білетін оқырман үшін өсек қауіпті емес, ол тек шыдамсыз аудиторияда өмір сүреді. Демек, өсекпен күрестің ең тиімді құралы — цензура емес, тәрбиеленген шыдам.',
          'Сонымен, мәселе журналистиканың жылдамдығында емес, оқырманның шыдамында. Жаңалықты жарты сағатқа кешіктірген редакция ештеңе жоғалтпайды — егер оқырман сол жарты сағатты күте алса. Ал күте алмайтын қоғам үшін кез келген жаңалық, тіпті шындық та, тек шу.'
        ], words: 334, note: '≈300 слов, 5 абзацев. C2: скрытый спор с редакторами, оговорка «бұл екіжүзділік емес», перенос проблемы на школу, афористичный финал.' },
      questions: [
        { id: 'r1', kind: 'mc', text: 'Редакторлардың «оқырманға деген құрмет» дәлеліне автор қалай қарайды?', options: ['Оқырман құқығын қорғайтын шынайы қамқорлық', 'Сыртқы әдемі дәлелдің астында пайда жатыр', 'Жаңалықты әдейі кешіктірудің жалған сылтауы'], answer: 1, explain: '«Бұл дәлел әдемі, бірақ оның астарында басқа есеп жатыр — кім бірінші жарияласа, соған көбірек басады».', explain_kk: '«Бұл дәлел әдемі, бірақ астарында басқа есеп жатыр — кім бірінші жарияласа, соған көбірек басады».' },
        { id: 'r2', kind: 'mc', text: 'Ірі порталдардың жаңалықтарының қанша бөлігі кейін түзетіледі немесе жойылады?', options: ['Әрбір оныншы жаңалық', 'Әр төртінші жаңалық', 'Әрбір екінші жаңалық'], answer: 1, explain: '«...әр төртінші жаңалығы кейін түзетілетінін немесе жойылатынын». «Оннан бірі» в тексте — доля тех, кто читает поправку.', explain_kk: '«...әр төртінші жаңалығы кейін түзетіледі немесе жойылады». «Оннан бірі» — түзетуді оқитындардың үлесі.' },
        { id: 'r3', kind: 'mc', text: '«Қатенің аудиториясы әрқашан үлкен» деген тұжырымның негізі неде?', options: ['Қате хабар шындықтан қызығырақ', 'Түзетуді оқитындар әлдеқайда аз', 'Порталдар түзетуді жарияламайды'], answer: 1, explain: 'Поправку читает меньше десятой части аудитории первого сообщения. Поправки при этом выходят — третий вариант противоречит тексту.', explain_kk: 'Түзетуді алғашқы хабардың оннан бірі де оқымайды. Түзету шығады — үшінші нұсқа мәтінге қайшы.' },
        { id: 'r4', kind: 'tf', text: 'Автор оқырманның мінез-құлқын екіжүзділік деп атайды.', answer: 1, explain: 'Бұрыс: «Бұл екіжүзділік емес, адам табиғаты».' },
        { id: 'r5', kind: 'mc', text: '«Біз шындықты бағалаймыз, ал жылдамдықты тұтынамыз» сөйлемінің мәні қандай?', options: ['Шындыққа жылдамдықтан көп ақша төлейміз', 'Шындықты қалаймыз, бірақ жылдамын оқимыз', 'Жылдам келген хабар әрқашан шындық болады'], answer: 1, explain: 'На словах ценим проверенное, на деле потребляем первое попавшееся. Буквальное прочтение «бағалау = платить» — ловушка.', explain_kk: 'Сөзде тексерілгенді бағалаймыз, іс жүзінде бірінші келгенді оқимыз. «Бағалау = ақша төлеу» — тура оқуға тұзақ.' },
        { id: 'r6', kind: 'mc', text: '«Баяу журналистика» неге оқырманды аз жинайды?', options: ['Мәтіндері ұзақ әрі сапасы нашар', 'Баяу оқу әдетпен ғана қалыптасады', 'Жарнамасы аз, сондықтан белгісіз'], answer: 1, explain: '«...баяу оқу — дағды, ал дағды жарнамамен емес, әдетпен қалыптасады». Качество автор, наоборот, хвалит («идея тамаша»).', explain_kk: '«...баяу оқу — дағды, ал дағды жарнамамен емес, әдетпен қалыптасады». Сапасын автор мақтайды.' },
        { id: 'r7', kind: 'mc', text: 'Автор кіммен дауласқысы келеді?', options: ['Редакторлармен', 'Мектеп жүйесімен', 'Сарапшылармен'], answer: 1, explain: '«...мен редакторлармен емес, мектеппен дауласқым келеді».', explain_kk: '«...редакторлармен емес, мектеппен дауласқым келеді».' },
        { id: 'r8', kind: 'tf', text: 'Автордың ойынша, өсекпен күрестің ең тиімді құралы — оқырманның шыдамы.', answer: 0, explain: 'Дұрыс: «өсекпен күрестің ең тиімді құралы — цензура емес, тәрбиеленген шыдам».', explain_kk: 'Дұрыс: «...ең тиімді құралы — цензура емес, тәрбиеленген шыдам».' },
        { id: 'r9', kind: 'mc', text: '«Тіпті шындық та, тек шу» деген тіркестегі автордың көзқарасы қандай?', options: ['Шындық бүгін ешкімге қажет болмай қалды', 'Шыдамсыз ортада шындық та мәнін жоғалтады', 'Шу мен шындықтың арасында айырма жоқ'], answer: 1, explain: 'Афористичный финал: для общества, не умеющего ждать, даже правда превращается в шум. Автор не говорит, что правда не нужна.', explain_kk: 'Күте алмайтын қоғам үшін шындық та шуға айналады. Автор шындық керек емес демейді.' },
        { id: 'r10', kind: 'mc', text: 'Мәтіннің негізгі ойын табыңыз.', options: ['Журналистерді асыққаны үшін жазалау керек', 'Мәселенің түйіні — оқырманның күте алмауы', 'Оқырман баспа газетіне қайта оралуы тиіс'], answer: 1, explain: '«Демек, мәселе журналистиканың жылдамдығында емес, оқырманның шыдамында».', explain_kk: '«...мәселе журналистиканың жылдамдығында емес, оқырманның шыдамында».' }

    'Текст скрыт, как на экзамене. Читайте вопросы во время звучания и отмечайте ответы сразу.': 'Мәтін емтихандағыдай жасырылған. Тыңдау кезінде сұрақтарды оқып, жауаптарды бірден белгілеңіз.',

    'В этом браузере нет голоса для казахского языка, кнопка воспроизведения отключена. Бесплатно работает в': 'Бұл браузерде қазақ тілінің дауысы жоқ, ойнату түймесі өшірілген. Тегін жұмыс істейді:',
    'До 15 вопросов: слова темы, окончания из грамматики урока и вопросы к текстам. Порог «тема пройдена» — 70 %.': '15 сұраққа дейін: тақырып сөздері, сабақ грамматикасының жалғаулары және мәтіндерге сұрақтар. «Тақырып өтілді» шегі — 70 %.',
    'Доступ к микрофону запрещён. Нажмите на значок замка или камеры в адресной строке и разрешите микрофон, затем повторите.': 'Микрофонға рұқсат берілмеді. Мекенжай жолындағы құлып немесе камера белгішесін басып, микрофонға рұқсат етіңіз де, қайталаңыз.',
    'секунд, читайте его вслух в темпе диктора и отвечайте по ходу — это слабая замена, но лучше, чем запоминать текст целиком.': 'секунд, оны диктор қарқынымен дауыстап оқып, жауаптарды сол кезде белгілеңіз — бұл әлсіз балама, бірақ мәтінді толық жаттағаннан жақсы.',
    'Похоже, это Edge — подождите пару секунд, голоса подгружаются, или проверьте, что в системе включён «Kazakh» в языках речи.': 'Бұл Edge сияқты — бірнеше секунд күтіңіз, дауыстар жүктелуде, немесе жүйеде сөйлеу тілдерінде «Kazakh» қосылғанын тексеріңіз.',

/* ============================================================

              #/course/:level[/:topic/:tab]  курс по уровням (course.js)
              #/exam/:exam  экзамен: структура + уровни
              #/test/:id    мок-тест: разделы и результаты
              #/test/:id/:section  прохождение раздела

   ============================================================ */
(function () {
  'use strict';
  var T = KZ.T, LK = KZ.LK;

  /* ---------------- статистика ----------------
     KZ.track(name, props) и trackPage(path) — единственная точка отправки. Работает только в публичной сборке
     (KZ.site.build === 'site'), чтобы лаборатория и локальные прогоны не пачкали цифры.
     Персональных данных не отправляем: идентификатор сессии случайный, живёт до закрытия вкладки и никуда не привязан.
     Два приёмника, оба необязательные: KZ.site.eventsUrl (свой endpoint — POST JSON, шлём sendBeacon,
     чтобы уход со страницы не терял событие) и счётчик из analyticsSnippet (GoatCounter / Umami / Plausible —
     что подключено, то и используется). Не настроено ничего → все вызовы молча ничего не делают. */
  var TRACK_ON = !!(KZ.site && KZ.site.build === 'site');
  var SID = (function () {
    if (!TRACK_ON) return '';
    try {
      var k = 'kz-trainer:sid', v = sessionStorage.getItem(k);
      if (!v) { v = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); sessionStorage.setItem(k, v); }
      return v;
    } catch (e) { return 'nostore'; }
  })();
  function sendEvent(name, props) {
    var url = KZ.site && KZ.site.eventsUrl; if (!url) return;
    var body = JSON.stringify({ e: name, sid: SID, lang: KZ.lang, ts: Date.now(), p: props || {} });
    /* тип тела — text/plain намеренно: это один из типов, не требующих предварительного запроса CORS.
       С application/json браузер шлёт preflight, а sendBeacon уходит с credentials, и ответ с '*' он не принимает —
       событие молча теряется. Приёмник разбирает тело как JSON независимо от заголовка. */
    try {
      if (navigator.sendBeacon) navigator.sendBeacon(url, new Blob([body], { type: 'text/plain;charset=UTF-8' }));
      else fetch(url, { method: 'POST', body: body, keepalive: true, headers: { 'Content-Type': 'text/plain;charset=UTF-8' } });
    } catch (e) {}
  }
  function track(name, props) {
    if (!TRACK_ON) return;
    sendEvent(name, props);
    try {
      if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: 'event/' + name, title: name, event: true });
      else if (window.umami && window.umami.track) window.umami.track(name, props || {});
      else if (window.plausible) window.plausible(name, { props: props || {} });
    } catch (e) {}
  }
  var lastPage = null;
  function trackPage(path) {
    if (!TRACK_ON || path === lastPage) return;
    lastPage = path;
    sendEvent('pageview', { path: path });
    try {
      if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: '/' + path });
      else if (window.plausible) window.plausible('pageview', { u: location.origin + location.pathname + '#/' + path });
    } catch (e) {}   // Umami считает переходы по history сам
  }
  KZ.track = track;

  /* ---------------- store ---------------- */
  var STORE_KEY = (KZ.site && KZ.site.build === 'lab') ? 'kz-trainer:lab:v1' : 'kz-trainer:v1'; // лаборатория хранит прогресс отдельно от сайта
  function loadState() {
    try { var s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.tests) return s; } catch (e) {}

  function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  /* ---------------- helpers ---------------- */

  /* Итог раздела для карточек: {label, cls} */

  /* Вердикт по строгой шкале (KZ.strict): вывод об уровне считается ТОЛЬКО по разделам с автоматической проверкой

    return '<div class="notice ' + (v.pass ? 'good' : v.all ? '' : 'info') + '"><b class="t">' + T('Результат') + ' · ' + t.level + '</b><p><b>' + head + '</b></p>' + selfNote + '<ul>' +
      v.rows.map(function (r) { return '<li>' + esc(r.name) + ': ' + (r.pct == null ? T('не пройден') : r.pct + ' %' + (r.self ? '' : ' ' + (r.ok ? '✓' : '✗'))) + (r.self ? ' <span class="muted">· ' + T('самооценка, в вывод не входит') + '</span>' : '') + (r.practice ? ' <span class="muted">· ' + T('тренировка без таймера — для подтверждения пройдите как на экзамене') + '</span>' : '') + '</li>'; }).join('') +

  /* ---------------- timer ---------------- */
  var timer = { iv: null, start: 0, limit: 0, el: null, onTick: null, warned: false };

  }
  /* Время раздела вышло — раздел закрывается, как на экзамене: ответы фиксируются, письмо/говорение переходят к самопроверке */
  function timeUp() {

    run.timedOut = true; run.secondsUsed = Math.round(elapsed()); stopTimer(); stopSpeak(); stopRec(); announce(T('Время вышло') + '. ' + T('Раздел закрыт по таймеру, как на экзамене: ответы зафиксированы, оцените то, что успели.'));

  }
  function timeUpNotice() {
    return run && run.timedOut ? '<div class="notice" role="alert"><b class="t">' + T('Время вышло') + '</b><p>' + T('Раздел закрыт по таймеру, как на экзамене: ответы зафиксированы, оцените то, что успели.') + '</p></div>' : '';
  }

  /* ---------------- TTS ---------------- */
  function kkVoices() {
    if (!window.speechSynthesis) return [];
    return speechSynthesis.getVoices().filter(function (v) { return /^kk/i.test(v.lang) || /kazakh|қазақ/i.test(v.name); });
  }
  function kkVoice() {
    var vs = kkVoices(); if (!vs.length) return null;
    var pref = state.voice; for (var i = 0; i < vs.length; i++) if (vs[i].name === pref) return vs[i];
    for (var j = 0; j < vs.length; j++) if (/natural|neural|online/i.test(vs[j].name)) return vs[j];
    return vs[0];
  }
  var ttsUtter = null;
  function speak(text, onEnd) {
    var v = kkVoice(); if (!v) return false;
    speechSynthesis.cancel();
    // Кусками по абзацам/репликам — длинные фразы некоторые движки обрывают.
    var parts = text.split(/\n+/).filter(function (x) { return x.trim(); });
    var i = 0;
    function next() {
      if (i >= parts.length) { ttsUtter = null; if (onEnd) onEnd(true); return; }
      var u = new SpeechSynthesisUtterance(parts[i++]); u.voice = v; u.lang = v.lang || 'kk-KZ'; u.rate = 0.92;
      u.onend = next; u.onerror = function () { ttsUtter = null; if (onEnd) onEnd(false); };

  }
  function stopSpeak() { if (window.speechSynthesis) speechSynthesis.cancel(); ttsUtter = null; }

  var isEdge = /Edg\//.test(navigator.userAgent);

  /* ---------------- перемешивание вариантов ответа ----------------
     В данных ключ часто стоит первым. Один раз при загрузке переставляем варианты детерминированно
     (сид = id теста + id вопроса), чтобы порядок был стабилен между сессиями и разбор совпадал с сохранёнными ответами. */

  }

  if (KZ.courses) Object.keys(KZ.courses).forEach(function (lv) { KZ.courses[lv].topics.forEach(function (tp) {
    tp.grammar.forEach(function (g) { g.tasks.forEach(function (x, i) { shuffleQuestion(x, lv + '/' + g.id + '/' + i); }); });

  }); });

  /* ---------------- router ---------------- */
  var run = null; // runtime state of the open section
  var qTimer = null; // per-question timer in speaking

  var extRoutes = [];
  KZ.registerRoute = function (fn) { extRoutes.push(fn); };
  var extRun = {};
  KZ.run = function () { return extRun; };

  var lastHash = null;

    if (!sameSection) { stopTimer(); if (qTimer) clearInterval(qTimer); if (tkTimer) clearInterval(tkTimer); run = null; stopSpeak(); stopRec(); }
    var app = document.getElementById('app');

    if (extHtml != null) { run = null; html = extHtml; }

    else if (p[0] === 'test' && findTest(p[1]) && p[2]) html = viewSection(findTest(p[1]), p[2]);

    if (samePage) { window.scrollTo(0, sy); if (fk) { var fe = null; try { fe = document.querySelector(fk); } catch (e) {} if (fe) try { fe.focus({ preventScroll: true }); } catch (e2) {} } }

    return topbar([{ label: T('Хаб') }], '<button class="btn ghost small" data-act="io">' + T('Прогресс: экспорт / импорт') + '</button>') +
      '<div class="kicker">' + T('Qazaq trainer · тренажёр') + '</div>' +
      '<h1>' + T('Подготовка к государственным экзаменам по казахскому языку') + '</h1>' +
      '<p class="lede">' + T('Два экзамена, уровни от A1 до C2, по несколько вариантов мок-теста на каждый уровень. Результаты по разделам сохраняются в этом браузере; для переноса на другое устройство есть экспорт.') + '</p>' +

      '<section><div class="kicker" style="margin-bottom:8px">' + T('Шкала') + '</div><h2>' + T('Как отличаются уровни в тренажёре') + '</h2>' +
      '<p class="sub">' + T('Объём лексики — по методике ҚАЗТЕСТ (testcenter.kz). Остальное — рабочие критерии дифференциации заданий, а не официальные требования.') + '</p>' +
      '<div class="ladder">' + KZ.levelOrder.map(function (lv) { var L = KZ.levels[lv]; return '<div class="rung"><div class="rung-level">' + lv + '</div><div class="rung-name">' + esc(LK(L, 'name')) + '</div><div class="rung-units">' + esc(LK(L, 'units')) + '</div><div class="rung-focus">' + esc(LK(L, 'focus')) + '</div></div>'; }).join('') + '</div></section>' +
      '<footer><p><a href="#/sources">' + T('Литература и источники') + '</a>' + (KZ.site && KZ.site.feedbackTelegram ? ' · <a href="https://t.me/' + esc(KZ.site.feedbackTelegram) + '" target="_blank" rel="noopener">' + T('Написать в Telegram') + '</a>' : '') + (KZ.site && KZ.site.siteUrl && location.protocol !== 'https:' && location.hostname !== 'localhost' ? ' · <a href="' + esc(KZ.site.siteUrl) + '" target="_blank" rel="noopener">' + T('Открыть сайт отдельной вкладкой') + '</a>' : '') + '</p>' + T('Форматы заданий везде — рабочая реконструкция по опубликованной структуре тестов, а не копия реального интерфейса. Подтверждённые и неподтверждённые факты помечены на странице каждого экзамена.') + (KZ.site && (KZ.site.eventsUrl || KZ.site.analyticsSnippet) ? '<p class="small muted">' + T('Мы считаем обезличенную статистику: какие разделы открывают и какие ответы выбирают. Без cookies, без регистрации, без личных данных — ответы нужны, чтобы находить неудачные вопросы и чинить их.') + '</p>' : '') + '</footer>';
  }
  function courseCards() {
    if (!KZ.courses) return '';
    var keys = Object.keys(KZ.courses); if (!keys.length) return '';
    return '<section><div class="kicker" style="margin-bottom:8px">' + T('Курс') + '</div><h2>' + T('Учебная программа по уровням') + '</h2><p class="sub">' + T('Программа построена на нашей методологии, разработанной с опорой на официальный лексический минимум ҰТО и типовые учебники уровней; по каждой теме — карточки слов, грамматика с заданиями, тексты с вопросами и итоговый тест.') + '</p><div class="grid2">' + keys.map(function (k) {
      var c = KZ.courses[k], pr = KZ.courseProgress ? KZ.courseProgress(c) : null;
      return '<a class="exam-card" href="#/course/' + k + '"><div class="row spread"><span class="badge level">' + k + '</span>' + (pr ? '<span class="badge ' + (pr.done ? 'ok' : 'muted') + '">' + pr.done + ' / ' + pr.topics + ' ' + T('тем') + '</span>' : '') + '</div><div class="name">' + esc(c.title) + ' · ' + esc(c.kk) + '</div><p class="tag">' + c.topics.length + ' ' + T('тем') + ' · ' + (c.stats.uniqueWords || c.stats.words) + ' ' + T('слов') + (c.coverage ? ' (' + LK(c, 'coverage') + ')' : '') + ' · ' + c.stats.grammar + ' ' + plural(c.stats.grammar, T('грамматическая тема'), T('грамматические темы'), T('грамматических тем')) + ' · ' + c.stats.texts + ' ' + T('текстов') + (c.stats.textsWithQuestions != null ? ', ' + T('с вопросами') + ' ' + c.stats.textsWithQuestions : '') + (pr && pr.known ? ' · ' + T('выучено') + ' ' + pr.known : '') + '</p></a>';
    }).join('') + '</div></section>';
  }
  function ioPanel() {
    return '<div class="block io"><h3>' + T('Экспорт и импорт прогресса') + '</h3>' +
      '<p class="small muted">' + T('Скопируйте JSON и сохраните где удобно; на другом устройстве вставьте его в поле и нажмите «Импортировать». Импорт заменяет текущий прогресс.') + '</p>' +

      '<div class="actions"><button class="btn small" data-act="io-copy">' + T('Скопировать') + '</button><button class="btn secondary small" data-act="io-import">' + T('Импортировать из поля') + '</button><button class="btn danger small" data-act="io-reset">' + T('Сбросить весь прогресс') + '</button><span class="hint" id="io-msg" role="status" aria-live="polite"></span></div></div>';
  }

  /* ---------------- views: exam ---------------- */
  function viewExam(ex) {
    var stages = ex.sections.map(function (s) {
      return '<div class="stage' + (s.hypothetical ? ' locked' : '') + '"><div class="stage-num">' + s.num + '</div><div><p class="stage-name">' + esc(KZ.lang === 'kk' ? s.kk : s.title) + (KZ.lang === 'kk' ? '' : ' <span class="muted small">' + esc(s.kk) + '</span>') + (s.hypothetical ? ' <span class="badge warn">' + T('гипотеза') + '</span>' : '') + '</p><p class="stage-desc">' + esc(LK(s, 'desc')) + '</p>' + tipsInline(s) + '</div>' +
        '<div class="stage-meta"><div class="stage-time">' + (s.minutes == null ? '—' : esc(s.minutes) + ' ' + T('мин')) + '</div><div class="stage-tasks">' + esc(LK(s, 'tasks')) + '</div></div></div>';
    }).join('');
    var levels = (ex.examLevels || KZ.levelOrder).map(function (lv) {
      var tests = testsFor(ex.id, lv);
      return tests.map(function (t) {
        var st = testStatus(t);
        var href = t.status === 'draft' ? '#/exam/' + ex.id : '#/test/' + t.id;
        return '<a class="level-row' + (t.status === 'draft' ? ' draft' : '') + '" href="' + href + '"><span class="lvl">' + lv + '</span><span><div class="nm">' + esc(LK(t, 'title')) + ' · ' + esc(LK(KZ.levels[lv], 'name')) + '</div><div class="dsc">' + esc(LK(t, 'summary')) + '</div></span><span class="st"><span class="badge ' + st.cls + '">' + st.label + '</span></span></a>';
      }).join('');
    }).join('');
    return topbar([{ label: T('Хаб'), href: '#/' }, { label: ex.short }]) +
      '<div class="kicker">' + esc(ex.kicker) + '</div><h1>' + esc(ex.name) + '</h1><p class="lede">' + esc(LK(ex, 'tagline')) + '</p>' +
      '<div class="notice ' + (ex.verified ? 'good' : '') + '"><b class="t">' + (ex.verified ? T('Подтверждено') : T('Не подтверждено')) + '</b><p>' + esc(LK(ex, 'verifiedNote')) + '</p></div>' +
      '<section><h2>' + T('Структура теста') + '</h2><p class="sub">' + (ex.verified ? T('По официальному описанию.') : T('Рабочая гипотеза по вторичным источникам — звёздочкой помечены цифры, требующие сверки.')) + '</p>' +
      '<div class="stages">' + stages + (ex.totalMinutes ? '<div class="stages-total"><span>' + T('Итого') + '</span><b>' + ex.totalMinutes + ' ' + T('минут') + ' · ' + ex.sections.length + ' ' + (ex.sections.length === 4 ? T('блока') : T('разделов')) + (ex.totalTasks ? ' · ' + ex.totalTasks + ' ' + T('задания') : '') + '</b></div>' : '') + '</div>' +
      (ex.mockNote ? '<p class="small muted mt">' + esc(LK(ex, 'mockNote')) + '</p>' : '') + '</section>' +
      (ex.scoring ? scoringTable(ex) : '') +
      ('<section><h2>' + T('Что официально не опубликовано') + '</h2><div class="notice"><b class="t">' + T('Рабочая реконструкция') + '</b><ul>' + ((KZ.lang === 'kk' && ex.unverified_kk) || ex.unverified).map(function (u) { return '<li>' + esc(u) + '</li>'; }).join('') + '</ul></div></section>') +
      '<section><h2>' + T('Мок-тесты') + '</h2><div class="levels">' + levels + '</div></section>' +
      '<footer>' + T('Источники:') + '<ul class="srclist">' + ex.sources.map(function (s) { return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(LK(s, 'title')) + '</a></li>'; }).join('') + '</ul></footer>';

  /* ---------------- views: test ---------------- */
  /* Объём раздела на странице теста: у разделов с вопросами показываем, сколько их в этом моке, а официальный объём
     экзамена — справкой. Раньше показывался только официальный («20 заданий · 20 баллов»), и мок из 5 вопросов
     выглядел недогрузившимся. */
  function stageTasks(s, es) {
    var official = LK(es, 'tasks') || '';
    if (!s.questions) return esc(official);
    var n = s.questions.length;
    var mine = n + ' ' + T('заданий') + (s.pointsPerTask ? ' · ' + n * s.pointsPerTask + ' ' + T('баллов') : '');
    return esc(mine) + (official && official.indexOf(String(n) + ' ') !== 0 ? '<br><span class="muted">' + T('на экзамене:') + ' ' + esc(official) + '</span>' : '');
  }
  function viewTest(t) {
    var ex = KZ.exams[t.exam];
    var st = testStatus(t);
    var stages = t.sections.map(function (s, i) {
      var es = examSection(ex, s.type) || {};
      var r = sectionResult(t.id, s);
      var meta = es.num || ('0' + (i + 1));
      return '<a class="stage" href="#/test/' + t.id + '/' + s.type + '"><div class="stage-num">' + meta + '</div><div><p class="stage-name">' + esc((KZ.lang === 'kk' && es.kk) || es.title || LK(KZ.sectionTypes[s.type], 'label')) + '</p><p class="stage-desc">' + esc(LK(s, 'intro')).slice(0, 140) + '…</p></div>' +
        '<div class="stage-meta"><div class="stage-time">' + s.minutes + ' ' + T('мин') + '</div><div class="stage-tasks">' + stageTasks(s, es) + '</div>' +
        (r ? '<div class="stage-score ' + r.cls + '">' + esc(r.label) + '</div>' : '<div class="stage-score muted">' + T('не пройден') + '</div>') + '</div></a>';
    }).join('');
    var total = t.sections.reduce(function (a, s) { return a + (s.minutes || 0); }, 0);
    return topbar([{ label: T('Хаб'), href: '#/' }, { label: ex.short, href: '#/exam/' + ex.id }, { label: t.level + ' · ' + LK(t, 'title') }],
        '<span class="badge level">' + t.level + '</span><span class="badge ' + st.cls + '">' + st.label + '</span>') +
      '<div class="kicker">' + esc(ex.kicker) + ' · ' + T('уровень') + ' ' + t.level + '</div><h1>' + esc(LK(t, 'title')) + ' — ' + esc(LK(KZ.levels[t.level], 'name')) + '</h1>' +
      '<p class="lede">' + esc(LK(t, 'summary')) + ' ' + T('Разделы можно проходить по порядку, как на экзамене, или по одному. Ответы фиксируются один раз, после этого открывается разбор.') + '</p>' +
      verdictCard(t) +
      '<div class="stages">' + stages + '<div class="stages-total"><span>' + T('Итого') + '</span><b>' + total + ' ' + T('минут') + ' · ' + t.sections.length + (t.sections.length === 4 ? ' ' + T('блока') : ' ' + T('разделов')) + '</b></div></div>' +
      '<div class="actions"><button class="btn danger small" data-act="reset-test" data-test="' + t.id + '">' + T('Сбросить результаты этого теста') + '</button>' +
      (tp(t.id).updatedAt ? '<span class="hint">' + T('последнее изменение:') + ' ' + fmtDate(tp(t.id).updatedAt) + '</span>' : '') + '</div>';
  }

  /* ---------------- views: section ---------------- */
  function viewSection(t, type) {
    var sec = null; t.sections.forEach(function (s) { if (s.type === type) sec = s; });
    if (!sec) return viewTest(t);
    var ex = KZ.exams[t.exam];
    var es = examSection(ex, type) || {};
    var saved = sp(t.id, type);
    if (!run || run.testId !== t.id || run.type !== type) {
      run = { testId: t.id, type: type, phase: saved && saved.status === 'done' ? 'review' : 'ready', answers: {}, sub: 'script' };
      if (saved && saved.status === 'draft') { run.phase = 'run'; run.resume = true; if (saved.answers) run.answers = Object.assign({}, saved.answers); if (saved.playsUsed != null) run.playsUsed = saved.playsUsed; }
    }
    var head = topbar([{ label: T('Хаб'), href: '#/' }, { label: ex.short, href: '#/exam/' + ex.id }, { label: t.level + ' · ' + LK(t, 'title'), href: '#/test/' + t.id }, { label: (KZ.lang === 'kk' && es.kk) || es.title || type }],
      '<span class="badge level">' + t.level + '</span>' + sectionDots(t, type));
    var title = '<div class="kicker">' + T('Раздел') + ' ' + (es.num || '') + ' · ' + es.kk + '</div><h1>' + esc((KZ.lang === 'kk' && es.kk) || es.title || LK(KZ.sectionTypes[type], 'label')) + '</h1>' +
      '<p class="lede' + (run.phase === 'ready' ? '' : ' hintx') + '">' + esc(LK(sec, 'intro')) + '</p>';
    title += timeUpNotice();
    var body;
    if (run.phase === 'ready') body = viewReady(t, sec, es);
    else if (run.phase === 'review') body = viewReview(t, sec, es, saved);
    else body = ({ listening: runListening, lexis: runQuiz, reading: runQuiz, writing: runWriting, speaking: runSpeaking })[type](t, sec, es);
    return head + title + body;
  }
  function sectionDots(t, cur) {
    return '<span class="progress-dots">' + t.sections.map(function (s) { var r = sp(t.id, s.type); return '<i class="' + (r && r.status === 'done' ? 'done' : r ? 'part' : '') + (s.type === cur ? ' cur' : '') + '" title="' + esc(LK(KZ.sectionTypes[s.type], 'label')) + '"></i>'; }).join('') + '</span>';
  }
  function viewReady(t, sec, es) {
    var n = sec.questions ? sec.questions.length + ' ' + T('заданий') : sec.tasks ? sec.tasks.length + ' ' + T('задания') : sec.prompts ? sec.prompts.length + ' ' + T('темы на выбор') : sec.sets ? sec.sets.length + ' ' + T('комплекта × 3 вопроса') : '';
    var pts = sec.tasks ? sec.tasks.reduce(function (a, x) { return a + (x.points || 0); }, 0) : sec.pointsPerTask && sec.questions ? sec.questions.length * sec.pointsPerTask : 0;
    var tasks = sec.tasks ? '<ol class="prompt-list mt">' + sec.tasks.map(function (x) { return '<li><span><b>' + esc(LK(x, 'title')) + '</b><br><span class="small muted">' + (x.minutes ? '~' + x.minutes + ' ' + T('мин') + ' · ' : '') + x.points + ' ' + T('баллов') + (x.minWords ? ' · ' + T('от') + ' ' + x.minWords + ' ' + T('слов') : '') + (x.questions ? ' · ' + x.questions.length + ' ' + T('вопросов') : '') + '</span></span></li>'; }).join('') + '</ol>' : '';
    return '<div class="block"><div class="row spread"><div><span class="badge exam">' + sec.minutes + ' ' + T('мин') + '</span> <span class="badge muted">' + n + '</span>' + (pts ? ' <span class="badge muted">' + pts + ' ' + T('баллов') + '</span>' : '') + '</div></div>' + tasks +
      '<p class="small muted mt">' + T('Задания созданы нашими специалистами по официальной структуре теста.') + '</p>' +
      (sec.checkNote ? '<div class="notice mt" style="margin-bottom:0"><b class="t">' + T('Орфография') + '</b><p>' + esc(LK(sec, 'checkNote')) + '</p></div>' : '') +

      '<button class="btn ghost small" data-act="report-open">' + T('Сообщить об ошибке') + '</button>' +

  function renderQuestions(sec, answers, locked, startNum, ctx) {
    return sec.questions.map(function (q, i) {
      var num = startNum ? startNum : i + 1;

        (locked ? (chosen === q.answer ? '<span class="verdict ok">✓ ' + T('верно') + '</span>' : '<span class="verdict no">✗ ' + T('неверно') + '</span>') : '') + '</p><ul class="opts" lang="kk">';
      opts.forEach(function (o, j) {
        var cls = 'opt';
        if (locked) { cls += ' locked'; if (j === q.answer) cls += ' correct'; else if (j === chosen) cls += ' wrong'; }
        else if (j === chosen) cls += ' selected';
        html += '<li><label class="' + cls + '"><input type="radio" name="' + q.id + '" value="' + j + '"' + (j === chosen ? ' checked' : '') + (locked ? ' disabled' : '') + '><span class="k">' + letter(j) + '</span><span>' + esc(o) + '</span></label></li>';
      });
      html += '</ul>';
      if (locked) html += '<div class="explain' + (chosen === q.answer ? '' : ' bad') + '"><b>' + letter(q.answer) + '.</b> ' + esc(LK(q, 'explain')) + '</div>' + reportBox(ctx, q, chosen);
      return html + '</div>';
