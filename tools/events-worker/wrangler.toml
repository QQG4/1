name = "qazaq-trainer-stats"
main = "worker.js"
compatibility_date = "2026-09-15"

[[d1_databases]]
binding = "DB"
database_name = "qazaq-trainer-stats"
database_id = "2be00da9-a124-48d7-8929-dc43f17ba07c"

# 03:17 UTC — удаление записей старше 12 месяцев; 04:00 UTC (09:00 по Алматы) — «задание дня» в Telegram
[triggers]
crons = ["17 3 * * *", "0 4 * * *"]

[vars]
# Канал «задания дня»: '@qazaqtrainer' или id канала. Пусто — воркер в Telegram ничего не публикует.
TG_CHANNEL = "@qazaqtrainer"
# Секреты (npx wrangler secret put ... --config wrangler.toml):
#   TG_BOT_TOKEN  — токен бота от @BotFather
#   TG_OWNER_CHAT — id личного чата владельца с ботом: туда идут отзывы, жалобы и ошибки сайта (узнать — команда /id боту)
#   TG_WEBHOOK_SECRET — секрет webhook бота (копия у владельца в ~/.config/qazaq-trainer/telegram.env);
#     после смены секрета или адреса воркера: открыть <адрес воркера>/tg/setup?key=<секрет>
